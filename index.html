<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca dos Novos Golaiafis pra Coisas Inimagináveis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
:root{--bg:#f1e6cf;--bg2:#e6d6b6;--ink:#2a1d12;--mut:#6b5438;--gold:#8a5a12;--wine:#6e1f2b;--card:#f8f0dd;--line:#b9985c;--good:#2f5a2a;--bad:#8a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110c;--bg2:#221910;--ink:#eadcc0;--mut:#b49b72;--gold:#d9a441;--wine:#c9586a;--card:#2a1f14;--line:#6b5230;--good:#8fc27f;--bad:#e08a8a}}
:root[data-theme="dark"]{--bg:#17110c;--bg2:#221910;--ink:#eadcc0;--mut:#b49b72;--gold:#d9a441;--wine:#c9586a;--card:#2a1f14;--line:#6b5230;--good:#8fc27f;--bad:#e08a8a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.55}
header{text-align:center;padding:40px 16px 20px;border-bottom:3px double var(--line);background:var(--bg2)}
h1{font-family:"Cinzel Decorative",Cinzel,Georgia,serif;font-size:clamp(1.4rem,4.5vw,2.6rem);line-height:1.2;margin:0;color:var(--gold);letter-spacing:.02em}
.sub{font-style:italic;color:var(--mut);margin:.5rem 0 0}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:22px}
nav span,nav a{text-decoration:none;font-family:Nunito,system-ui,sans-serif;font-size:.85rem;padding:8px 16px;border:1px solid var(--line);border-radius:4px 4px 0 0;color:var(--mut);opacity:.6}
nav .on{background:var(--wine);color:#f8f0dd;border-color:var(--wine);opacity:1}
main{max-width:1100px;margin:0 auto;padding:24px 16px 56px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.bar input{flex:1 1 220px;font:inherit;padding:9px 12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:3px}
.bar button{font-family:Nunito,system-ui,sans-serif;font-size:.8rem;padding:8px 12px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:3px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--gold);color:var(--bg);border-color:var(--gold)}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
h2{font-family:Nunito,system-ui,sans-serif;color:var(--wine);border-bottom:1px solid var(--line);padding-bottom:6px;margin:30px 0 14px;font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:2px}
.card>button{all:unset;display:block;box-sizing:border-box;width:100%;padding:14px 16px;cursor:pointer}
.card h3{font-family:Nunito,system-ui,sans-serif;margin:0;font-size:1.15rem;color:var(--ink)}
.card .esp{font-style:italic;color:var(--gold);font-size:.95rem;margin:2px 0 6px}
.card p{margin:0;font-size:.98rem}
.det{display:none;padding:0 16px 14px;font-size:.95rem}
.card.open .det{display:block}
.card.open{border-left-color:var(--wine)}
.det b{font-family:Nunito,system-ui,sans-serif;font-size:.85rem;display:block;margin-top:8px}
.det .g{color:var(--good)}.det .r{color:var(--bad)}.det .m{color:var(--mut)}
.hint{font-size:.8rem;color:var(--mut);margin-top:6px;display:block}
.none{text-align:center;color:var(--mut);font-style:italic}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:0 16px 30px}
.o{--ac:#6e1f2b}.e{--ac:#2d6a6a}.a{--ac:#4f6b2a}
.sec{display:flex;align-items:center;gap:14px;border:0;margin:44px 0 24px;padding:0;color:var(--gold);font-size:1.35rem}
.sec::after{content:"";flex:1;height:3px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px 24px}
.cd{display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);outline:1px solid var(--line);outline-offset:4px;border-radius:3px;overflow:hidden;box-shadow:0 8px 0 -3px var(--line)}
.ph{aspect-ratio:1/1;position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 60%,#000),color-mix(in srgb,var(--ac) 30%,var(--bg2)));background-size:cover;background-position:center}
.ph i{font-style:normal;font-size:84px;opacity:.3}
.ph small{position:absolute;bottom:6px;right:10px;font-size:.72rem;color:#f8f0dd;opacity:.75}
.md{position:relative;width:58px;height:58px;border-radius:50%;background:var(--card);border:3px solid var(--ac);display:grid;place-items:center;font-size:28px;margin:-29px 0 0 16px;box-shadow:0 2px 0 var(--line)}
.cb{padding:8px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cd h3{margin:0;font-size:1.25rem}
.tag{font-style:italic;color:var(--mut);font-size:.95rem}
.cd p{margin:0;font-size:.98rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.vb{margin-top:auto;display:block;text-align:center;text-decoration:none;font-family:Nunito,system-ui,sans-serif;font-weight:700;background:var(--ac);color:#fffaf0;padding:10px;border-radius:2px}
.vb:hover{filter:brightness(1.15)}
.dv{max-width:860px;margin:0 auto}
.back{display:inline-block;margin-bottom:16px;font-family:Nunito,system-ui,sans-serif;color:var(--wine);text-decoration:none}
.dh{background:var(--card);border:2px solid var(--line);outline:1px solid var(--line);outline-offset:4px;overflow:hidden}
.dh .ph{aspect-ratio:16/9}.dh .ph i{font-size:150px}
.dt{padding:0 24px 24px}
.dt .md{width:84px;height:84px;font-size:42px;margin:-42px 0 10px}
.nm{border:0;margin:0;padding:0;color:var(--ink);font-size:2rem}
.rs{margin:12px 0 0;font-size:1.1rem}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:28px}
.pn section{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);padding:12px 16px}
.pn h4{font-family:Nunito,system-ui,sans-serif;margin:0 0 4px;color:var(--c)}
.pn p{margin:0}
.k1,.k3{--c:var(--good)}.k2{--c:var(--bad)}.k4{--c:var(--mut)}
.pv{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px}
.pv a{font-family:Nunito,system-ui,sans-serif;color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:8px 14px;border-radius:3px}
.up{position:absolute;top:8px;right:8px;background:rgba(20,12,6,.72);color:#f8f0dd;font-family:Nunito,system-ui,sans-serif;font-size:.75rem;padding:6px 10px;border-radius:3px;cursor:pointer}
.up:hover,.add:hover{filter:brightness(1.2)}
.up:focus-within,.add:focus-within{outline:2px solid var(--wine)}
.gal{margin-top:28px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);padding:12px 16px 16px}
.gal h4{font-family:Nunito,system-ui,sans-serif;margin:0 0 10px;color:var(--gold)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.th,.add{aspect-ratio:1/1;border-radius:3px;border:1px solid var(--line)}
.th{position:relative;background-size:cover;background-position:center}
.th button{position:absolute;top:4px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(20,12,6,.75);color:#f8f0dd;cursor:pointer;font-size:14px}
.th button[data-a=c]{left:4px}.th button[data-a=x]{right:4px}
.add{display:grid;place-items:center;text-align:center;border-style:dashed;color:var(--mut);cursor:pointer;font-family:Nunito,system-ui,sans-serif;font-size:.8rem;padding:6px}
.nt{margin:10px 0 0;font-size:.8rem;color:var(--mut)}
.g1{--ac:#6e1f2b}.g2{--ac:#6b5230}.g3{--ac:#2d6a6a}.g4{--ac:#4f3a7a}.g5{--ac:#2d4f7a}.g6{--ac:#7a5a1f}
.g7{--ac:#3f6b3a}
.g8{--ac:#5a3a6b}
.g9{--ac:#7a4a1f}
.g10{--ac:#2d6a5a}
.g11{--ac:#8a3a1f}
.grp{font-family:Nunito,system-ui,sans-serif;color:var(--mut);font-size:1.05rem;margin:26px 0 14px}
.sm{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 14px}.sm .ph{aspect-ratio:4/3}.sm .ph i{font-size:48px}.sm .ph small{font-size:.6rem}.sm .up{font-size:.62rem;padding:4px 6px}.sm .md{width:40px;height:40px;font-size:20px;margin:-20px 0 0 12px;border-width:2px}.sm .cb{padding:6px 12px 12px;gap:4px}.sm h3{font-size:1rem}.sm .tag{font-size:.8rem}.sm p{font-size:.85rem;-webkit-line-clamp:3}.sm .vb{padding:6px;font-size:.8rem}
.pn ul{margin:0;padding-left:20px}.pn li{margin:2px 0}
.tw{overflow-x:auto;margin-bottom:8px}.tb{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}.tb th,.tb td{border:1px solid var(--line);padding:8px 12px;text-align:left}.tb th{font-family:Nunito,system-ui,sans-serif;font-size:.85rem;background:var(--bg2);color:var(--wine)}.tb td.n,.tb th.n{text-align:center}.tb td:first-child{font-weight:700}.tn{color:var(--mut);font-style:italic;margin:0 0 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--wine);color:#fff;padding:10px 16px;border-radius:4px;z-index:20}
</style>
</head>
<body>
<header>
<h1>Biblioteca dos Novos Golaiafis pra Coisas Inimagináveis</h1>
<p class="sub">Guia de aventuras para quem ousa abrir o livro</p>
<nav aria-label="Abas"><a href="#classes" data-t="c" class="on">Classes</a><a href="#subclasses" data-t="s">Subclasses</a><a href="#tabelas" data-t="t">Tabelas</a><span>Raças · em breve</span><span>Deuses · em breve</span><span>Batalhas · em breve</span></nav>
</header>
<main>
<div class="bar">
<input id="q" type="search" placeholder="Buscar classe…" aria-label="Buscar classe">
<button data-f="" aria-pressed="true">Todas</button>
<button data-f="o" aria-pressed="false">D&amp;D 2024</button>
<button data-f="e" aria-pressed="false">Eberron</button>
<button data-f="a" aria-pressed="false">Xyleff Sualky</button>
</div>
<div id="out"></div>
</main>
<footer>Escolha uma classe e toque em Ver mais para abrir a página dela.</footer>
<script>
var G={o:"Classes oficiais — D&D 2024",e:"Classe oficial — Eberron",a:"Classes alternativas — Guia de Xyleff Sualky"};
// [grupo, nome, resumo, especialidade, fortes, fracos, faz bem, não faz]
var D=[
["o","Bárbaro","Guerreiros implacáveis, movidos por uma fúria incomparável. Não são conhecidos por sua inteligência, mas por sua força monstruosa, resistência absurda e coragem de enfrentar exércitos inteiros sem sequer vestir uma armadura.","Força bruta e resistência física","Vida elevada, resistência a dano físico na Fúria, força, mobilidade, dano corporal","Vulnerável a efeitos mentais, depende da Fúria, alcance limitado","Linha de frente, agarrar inimigos, destruir obstáculos, intimidar","Conjuração, cura, controle mágico, ataque à distância eficiente"],
["o","Bardo","Artistas capazes de transformar palavras em armas e melodias em milagres. Com seu carisma sobrenatural, podem encantar reis, humilhar demônios e inspirar guerreiros a realizar feitos impossíveis.","Suporte, carisma e versatilidade","Inspiração, conjuração completa, especialização em perícias, versatilidade social","Resistência física moderada, depende de recursos mágicos","Persuasão, enganação, encantamento, suporte, cura, controle de inimigos","Absorver muito dano ou dominar o combate físico sem especialização"],
["o","Bruxo","Detentores de poderes proibidos, adquiridos através de pactos com entidades extraordinárias. Carregam segredos que mortais jamais deveriam conhecer e invocam forças capazes de aterrorizar até os mais poderosos magos.","Poderes sobrenaturais e personalização","Invocações Místicas, truques poderosos, espaços de pacto recuperados em descanso curto","Poucos espaços de magia, depende das invocações escolhidas","Dano mágico consistente, maldições, combate à distância","Muitas magias de alto nível seguidas, atuar como curandeiro"],
["o","Clérigo","Representantes do poder divino entre os mortais. Suas preces realizam milagres, suas mãos restauram vidas e sua fé é capaz de reduzir criaturas profanas a cinzas.","Magia divina, proteção e cura","Conjuração completa, armaduras, cura, Canalizar Divindade, proteção","Depende de espaços de magia e concentração, mobilidade comum","Curar, ressuscitar, proteger aliados, enfrentar mortos-vivos, dano radiante","Furtividade, combate marcial avançado, magia arcana abrangente"],
["o","Druida","Guardiões das forças primordiais da natureza. Podem assumir a forma de feras, despertar a fúria das tempestades e transformar a própria natureza em um exército contra seus inimigos.","Natureza, transformação e controle territorial","Forma Selvagem, conjuração completa, cura, magias naturais variadas","Gerenciamento complexo, concentração, limites da Forma Selvagem","Exploração, reconhecimento, sobrevivência, invocação, controle do campo","Dominar armas marciais, substituir um especialista social"],
["o","Feiticeiro","Seres que carregam a magia no próprio sangue. Não precisam de décadas de estudos para dominar o sobrenatural, pois sua própria existência é uma fonte inesgotável de potencial arcano.","Manipulação e potencialização da magia","Metamagia, Feitiçaria Inata, Carisma alto, modifica conjurações","Poucos pontos de vida, sem armadura, repertório menor que o do mago","Dano mágico, explosões de poder, encantamentos, conjuração ofensiva","Combate físico prolongado, cura especializada, variedade de rituais"],
["o","Guardião (Patrulheiro)","Caçadores lendários, mestres da sobrevivência e perseguidores de monstros. Onde outros enxergam uma floresta inexplorável, eles enxergam um território de caça do qual nenhuma presa escapa facilmente.","Caça, exploração e combate híbrido","Ataque Extra, maestria em armas, perícias, sobrevivência, magias de apoio","Depende de vários atributos, magias de concentração competem","Rastrear, explorar, combater à distância, emboscar, perseguir","Magias de alto nível, substituir especialistas em todas as situações"],
["o","Guerreiro","Mestres absolutos das armas e da arte da guerra. Enquanto outros dependem de magia ou poderes sobrenaturais, guerreiros transformam treinamento, técnica e determinação em forças capazes de desafiar criaturas lendárias.","Domínio das armas e combate marcial","Muitos ataques, Surto de Ação, maestrias, armaduras, talentos extras","Sem magia na classe base, poucas opções sobrenaturais","Dano físico consistente, corpo a corpo ou à distância, defesa, explosões de ataques","Curar, conjurar, teletransportar, controle mágico"],
["o","Ladino","Mestres das sombras, da precisão e da trapaça. Nenhuma fechadura é impossível, nenhum tesouro está verdadeiramente seguro e um único golpe certeiro pode decidir uma batalha antes mesmo que ela comece.","Precisão, furtividade e perícias","Ataque Furtivo, Especialização, Talento Confiável, mobilidade, evasão","Depende das condições do Ataque Furtivo, sem Ataque Extra na base","Infiltração, armadilhas, fechaduras, espionagem, eliminar alvos","Dano em área, cura, conjuração completa, aguentar a linha de frente"],
["o","Mago","Eruditos que dedicaram suas vidas a desvendar os segredos da realidade. Com conhecimento suficiente, podem dobrar o espaço, manipular o tempo e transformar campos de batalha em cenários de destruição absoluta.","Conhecimento e versatilidade arcana","Grimório expansível, enorme variedade de magias, rituais, controle mágico","Poucos pontos de vida, sem armaduras, depende de preparação e recursos","Controle territorial, dano em área, investigação arcana, teletransporte","Cura direta convencional, combate físico prolongado"],
["o","Monge","Mestres do corpo, da mente e da energia interior. Seus punhos são armas mortais, seus movimentos desafiam os limites físicos e sua disciplina lhes permite enfrentar monstros sem precisar empunhar uma espada.","Mobilidade e combate desarmado","Velocidade, múltiplos golpes, defesa, mobilidade, sem depender de equipamentos","Depende de Destreza e Sabedoria, Foco limitado, alcance reduzido","Perseguir, atravessar obstáculos, atordoar, desviar ataques, lutar desarmado","Conjuração completa, cura especializada, dano em área"],
["o","Paladino","Campeões de juramentos sagrados, cuja convicção se manifesta como poder sobrenatural. São fortalezas vivas, capazes de proteger seus companheiros e esmagar seus inimigos com golpes carregados de poder radiante.","Combate sagrado e proteção","Armaduras pesadas, auras, cura, ótimas salvaguardas, golpes divinos","Depende de vários atributos, poucos espaços de magia, fraco à distância","Proteger aliados, enfrentar chefes, combater criaturas profanas, resistir a efeitos negativos","Magia de alto nível, furtividade, controle mágico amplo"],
["e","Artífice","Inventores geniais que unem ciência, engenharia e magia. Enquanto magos estudam o impossível, artífices o constroem, criando armamentos encantados, máquinas extraordinárias e invenções capazes de revolucionar civilizações.","Invenções, equipamentos mágicos e suporte técnico","Infusões, ferramentas, itens mágicos, armaduras médias, escudos, magias de suporte","Progressão mágica reduzida, poucas infusões, depende de equipamentos","Aprimorar equipamentos, fortalecer aliados, resolver problemas técnicos, identificar itens mágicos","Magias acima do 5º círculo, criar qualquer invenção sem restrições"],
["a","Lutador","Máquinas de combate corporal, especialistas em transformar seus próprios corpos em armas devastadoras. Seus punhos esmagam defesas, suas técnicas derrubam gigantes e cada golpe carrega uma brutalidade aterrorizante.","Artes marciais e combate físico","Dado de vida d10, técnicas corporais, armas corporais especiais","Alcance reduzido, poucas armas, sem conjuração","Duelos, combate desarmado, agressão física, inimigos próximos","Curar aliados, longa distância, suporte mágico"],
["a","Cozinheiro","Mestres da gastronomia arcana, capazes de transformar monstros aterrorizantes em deliciosos banquetes. Enquanto aventureiros temem enfrentar um dragão, cozinheiros imaginam quais temperos combinariam com sua carne.","Alimentação monstruosa e fortalecimento de aliados","Refeições mágicas, petiscos, mutações, temperos metamágicos, Constituição","Depende de ingredientes, criaturas, herbalismo e receitas","Fortalecer aliados, conceder benefícios, usar recursos de monstros","Alimentar quem não come, substituir um combatente marcial"],
["a","Curandeiro","Gênios da medicina que desafiam a morte através do conhecimento. Sem depender de deuses ou feitiços, conseguem tratar ferimentos terríveis, combater doenças e arrancar seus companheiros das garras da morte.","Medicina e recuperação física","Dado de vida d10, armaduras médias, escudos, conhecimento medicinal","Depende de tratamentos e recursos médicos, pouco ofensivo","Tratar ferimentos, recuperar aliados, manter o grupo de pé","Magia arcana, combate marcial avançado, destruição em área"],
["a","Shinobi","Guerreiros silenciosos, mestres do Ki, da furtividade e das técnicas marciais. Movem-se como fantasmas e atacam com tamanha velocidade que seus inimigos podem ser derrotados antes mesmo de perceberem sua presença.","Velocidade, precisão e técnicas secretas","Ki, mobilidade alta, evasão, furtividade, armas marciais","Dado de vida d6, pouca resistência física, depende do Ki","Emboscadas, assassinatos, esquivas, infiltração, ataques precisos","Absorver muito dano, ser o curandeiro principal"],
["a","Xamã","Intermediários entre o mundo dos vivos e o reino dos espíritos. Carregam a sabedoria de gerações esquecidas e canalizam forças ancestrais que transcendem a compreensão dos mortais.","Espíritos, totens e forças ancestrais","Invocações ancestrais, poderes elementais, totens, habilidades personalizáveis","Restrição a equipamentos metálicos, depende do posicionamento dos totens","Suporte espiritual, fortalecer aliados, manipulação elemental, controle territorial","Combate marcial pesado, substituir um especialista em furtividade"],
["a","Infiltrador","Espiões extraordinários, mestres dos disfarces, da manipulação e do improviso. Qualquer objeto pode se tornar uma arma em suas mãos, e até o castelo mais protegido pode se tornar seu playground. Talvez você já conheça um sem saber.","Espionagem e manipulação social","Disfarces avançados, imitação, falsificação, armas improvisadas, furtividade","Armamento limitado, pouco preparado para confronto militar direto","Espionagem, sabotagem, assassinato, obter informações, falsificar identidades","Linha de frente pesada, cura especializada, conjuração completa"],
["a","Invocador","Conjuradores que estabelecem vínculos extraordinários com criaturas poderosas. Nunca enfrentam uma batalha sozinhos, pois lutam ao lado de companheiros monstruosos cuja força e lealdade desafiam qualquer adversário.","Combate através de criaturas invocadas","Invocações, versatilidade das criaturas, presença espalhada no campo","Dado de vida d6, sem armaduras, depende das invocações","Combate indireto, pressão sobre inimigos, uso estratégico de criaturas","Combate físico independente, aguentar a linha de frente, armas pesadas"],
["a","Runomante","Mestres da escrita arcana, capazes de aprisionar poderes extraordinários em simples símbolos. Uma única inscrição pode erguer defesas, transportar criaturas ou desencadear uma destruição colossal. Sua caneta é mais perigosa que uma espada.","Armazenamento e programação de magia","Conjuração completa, runas programáveis, efeitos armazenados, preparação estratégica","Dado de vida d6, sem armaduras, runas complexas de gerenciar","Preparar efeitos mágicos, armadilhas, defesas, planejar confrontos","Combate marcial especializado, absorver dano físico prolongado"],

var SB=[
["g1","Trilha do Berserker","Guerreiros consumidos por uma fúria insaciável, capazes de transformar qualquer batalha em um massacre. Atacam com brutalidade descomunal, desafiam o medo e revidam cada golpe recebido com uma violência ainda maior.","Livro do Jogador (2024 e 2014).","Bárbaro","💢"],
["g1","Trilha do Coração Selvagem","Guerreiros conectados aos espíritos das feras selvagens. Carregam a resistência dos ursos, a liberdade das águias e os instintos dos lobos, tornando-se a manifestação viva da ferocidade da natureza.","Livro do Jogador (2024). Anteriormente conhecida como Trilha do Guerreiro Totêmico (2014).","Bárbaro","🐺"],
["g1","Trilha da Árvore do Mundo","Guerreiros conectados à lendária Yggdrasil, a árvore que sustenta os planos da existência. Suas raízes atravessam dimensões, protegem companheiros e arrastam inimigos para o alcance de seus golpes devastadores.","Livro do Jogador (2024).","Bárbaro","🌳"],
["g1","Trilha do Fanático","Campeões escolhidos por forças divinas, cuja fúria transcende os limites da mortalidade. Seus golpes carregam poder celestial ou necrótico, e até a própria morte encontra dificuldades para interromper sua marcha.","Livro do Jogador (2024). Originalmente publicada no Guia de Xanathar para Todas as Coisas (2017).","Bárbaro","⚡"],
["g2","Trilha do Guardião Ancestral","Guerreiros acompanhados pelos espíritos de seus antepassados. Nunca lutam verdadeiramente sozinhos, pois carregam consigo gerações de guerreiros falecidos, capazes de proteger seus aliados até mesmo além da morte.","Guia de Xanathar para Todas as Coisas (2017).","Bárbaro","👻"],
["g2","Trilha do Arauto da Tempestade","Catástrofes naturais em forma de guerreiros. Sua fúria manifesta o calor escaldante dos desertos, os relâmpagos dos oceanos ou o frio mortal das tundras, transformando sua presença em uma ameaça constante.","Guia de Xanathar para Todas as Coisas (2017).","Bárbaro","⛈️"],
["g2","Trilha do Furioso de Batalha (Battlerager)","Guerreiros brutais revestidos de armaduras espinhosas, capazes de transformar seus próprios corpos em armas de guerra. Abraçar um desses bárbaros é praticamente assinar uma sentença de morte.","Guia do Aventureiro da Costa da Espada (2015).","Bárbaro","🦔"],
["g2","Trilha da Besta","Guerreiros que libertam a monstruosidade adormecida dentro de seus corpos. Desenvolvem garras dilacerantes, presas aterrorizantes e caudas mortais, tornando-se predadores que dispensam completamente armas convencionais.","Caldeirão de Todas as Coisas de Tasha (2020).","Bárbaro","🦷"],
["g2","Trilha da Magia Selvagem","Guerreiros cuja fúria desperta manifestações caóticas de energia arcana. Nem mesmo eles sabem exatamente o que acontecerá quando se enfurecerem, tornando cada batalha um espetáculo de força bruta e magia imprevisível.","Caldeirão de Todas as Coisas de Tasha (2020).","Bárbaro","🎲"],
["g2","Trilha do Gigante","Guerreiros que canalizam o poder primordial dos gigantes, aumentando seu tamanho e revestindo suas armas com forças elementais. São capazes de arremessar armas, aliados e inimigos como se fossem meros brinquedos.","Bigby Apresenta: Glória dos Gigantes (2023).","Bárbaro","🗿"],
["g3","Trilha do Guardião Espiritual","Guerreiros que invocam espíritos ancestrais, selvagens e cósmicos para lutar ao seu lado. Seus protetores espirituais enfraquecem inimigos, defendem companheiros e transformam seus golpes em manifestações de poder sobrenatural.","D&D: World of Warcraft (2026). Reformulação do Guardião Ancestral.","Bárbaro","🔮"],
["g3","Trilha dos Elementos","Guerreiros que carregam dentro de si a violência primordial dos elementos. Sua fúria desperta explosões de lava, descargas elétricas e poderes congelantes, transformando-os em verdadeiras calamidades ambulantes.","D&D: World of Warcraft (2026).","Bárbaro","🌋"],
["g4","Trilha do Lamento","Guerreiros cuja fúria manifesta o horror sobrenatural das banshees. Seus gritos devastam a mente dos inimigos e são capazes de arrancar os últimos fragmentos de vida daqueles que já se encontram enfraquecidos.","Unearthed Arcana: Villainous Options 2 (2026).","Bárbaro","📢"],
["g1", "Colégio da Dança", "Artistas que transformam cada movimento em uma manifestação de magia. Dançam entre espadas, escapam de golpes mortais e transformam seus próprios corpos em instrumentos de combate, fazendo do campo de batalha seu maior palco.", "Livro do Jogador (2024).", "Bardo", "💃"],
["g1", "Colégio do Conhecimento", "Detentores de histórias esquecidas, segredos proibidos e conhecimentos que atravessam gerações. Suas palavras são tão poderosas que podem arruinar os planos de reis e transformar a sabedoria de outros conjuradores em suas próprias armas.", "Livro do Jogador (2024 e 2014).", "Bardo", "📚"],
["g1", "Colégio do Glamour", "Artistas agraciados pela magia das fadas, cuja beleza e presença desafiam a vontade dos mortais. Uma única apresentação pode conquistar multidões, subjugar guerreiros e fazer reis se curvarem diante de sua magnificência.", "Livro do Jogador (2024). Originalmente publicado no Guia de Xanathar para Todas as Coisas (2017).", "Bardo", "✨"],
["g1", "Colégio do Valor", "Cantores de guerras e protagonistas de lendas heroicas. Marcham ao lado dos maiores guerreiros, empunhando armas e entoando canções capazes de transformar soldados comuns em campeões imortais.", "Livro do Jogador (2024 e 2014).", "Bardo", "🛡️"],
["g5", "Colégio da Lua", "Artistas que extraem sua magia do brilho da lua, dos círculos feéricos e das antigas forças da natureza. Suas canções carregam o mistério da noite e o poder primordial das terras selvagens.", "Forgotten Realms: Heroes of Faerûn (2025).", "Bardo", "🌙"],
["g5", "Colégio dos Espíritos", "Contadores de histórias que atravessam a fronteira entre a vida e a morte. Invocam as lendas daqueles que já partiram, permitindo que guerreiros, monstros e heróis esquecidos voltem a influenciar o mundo dos vivos.", "Ravenloft: The Horrors Within (2026). Originalmente publicado no Guia de Van Richten para Ravenloft (2021).", "Bardo", "🕯️"],
["g2", "Colégio das Espadas", "Artistas que transformam lâminas em instrumentos de espetáculo e morte. Cada movimento é uma apresentação, cada corte uma obra de arte e cada duelo uma oportunidade de demonstrar sua superioridade.", "Guia de Xanathar para Todas as Coisas (2017).", "Bardo", "🤺"],
["g2", "Colégio dos Sussurros", "Espiões aterrorizantes que utilizam palavras como venenos e segredos como armas. Podem semear o medo, roubar a identidade dos mortos e destruir reputações sem jamais revelar suas verdadeiras intenções.", "Guia de Xanathar para Todas as Coisas (2017).", "Bardo", "🤫"],
["g2", "Colégio da Criação", "Artistas que dominam os ecos da canção responsável pela criação do universo. Suas melodias transformam o nada em matéria e concedem movimento a objetos inanimados, fazendo da imaginação sua ferramenta mais poderosa.", "Caldeirão de Todas as Coisas de Tasha (2020).", "Bardo", "🎼"],
["g2", "Colégio da Eloquência", "Oradores cuja língua é mais perigosa que qualquer espada. São capazes de conquistar multidões, desestabilizar a vontade dos inimigos e convencer até os mais desconfiados governantes através de argumentos aparentemente irrefutáveis.", "Odisseias Míticas de Theros (2020) e Caldeirão de Todas as Coisas de Tasha (2020).", "Bardo", "🗣️"],
["g1", "Patrono Arquifada", "Servos de entidades feéricas ancestrais, capazes de transformar a realidade em um espetáculo de ilusões e encantamentos. Desaparecem diante de seus inimigos, surgem em lugares impossíveis e brincam com as emoções dos mortais.", "Livro do Jogador (2014 e 2024).", "Bruxo", "🧚"],
["g1", "Patrono Celestial", "Portadores do poder de seres celestiais, capazes de iluminar as profundezas do inferno e devolver a esperança aos moribundos. Suas mãos restauram vidas, enquanto suas chamas sagradas castigam aqueles que desafiam as forças superiores.", "Livro do Jogador (2024). Originalmente publicado no Guia de Xanathar para Todas as Coisas (2017).", "Bruxo", "😇"],
["g1", "Patrono O Grande Antigo", "Mortais que ousaram estabelecer contato com entidades anteriores à própria civilização. Suas mentes carregam segredos incompreensíveis, seus pensamentos atravessam a consciência alheia e sua magia transforma a sanidade dos inimigos em algo extremamente frágil.", "Livro do Jogador (2014 e 2024).", "Bruxo", "🌌"],
["g1", "Patrono Ínfero", "Detentores de poderes concedidos pelos habitantes mais aterrorizantes dos planos inferiores. Invocam chamas devastadoras, fortalecem-se com a queda de seus inimigos e podem arrastar suas vítimas através dos próprios horrores do inferno.", "Livro do Jogador (2014 e 2024).", "Bruxo", "😈"],
["g5", "Patrono Morto-Vivo (Undead)", "Seguidores de liches, vampiros e outras entidades que conquistaram a imortalidade. Transformam seus corpos em manifestações aterrorizantes da morte, espalhando medo e canalizando energias capazes de consumir a vitalidade dos vivos.", "Ravenloft: The Horrors Within (2026). Originalmente publicado no Guia de Van Richten para Ravenloft (2021).", "Bruxo", "💀"],
["g5", "Patrono Vestígio (Vestige)", "Mortais que carregam os últimos fragmentos de entidades divinas decadentes. Enquanto o mundo esquece seus antigos deuses, esses bruxos preservam suas essências e manifestam os restos de um poder que outrora foi venerado por civilizações inteiras.", "Arcana Unleashed (2026).", "Bruxo", "🏺"],
["g2", "Patrono Imortal (Undying)", "Mortais que negociaram com entidades que desafiaram a passagem do tempo. Seus corpos resistem às doenças, ao envelhecimento e às necessidades da carne, aproximando-se lentamente de uma existência que jamais deveria ser alcançada.", "Guia do Aventureiro da Costa da Espada (2015).", "Bruxo", "♾️"],
["g2", "Patrono Lâmina Maldita (Hexblade)", "Guerreiros arcanos conectados a entidades misteriosas do Pendor das Sombras, cujo poder se manifesta através de armas sobrenaturais. Amaldiçoam suas vítimas, fortalecem suas lâminas e podem obrigar os espíritos dos inimigos derrotados a servi-los.", "Guia de Xanathar para Todas as Coisas (2017).", "Bruxo", "🌑"],
["g2", "Patrono das Profundezas (Fathomless)", "Servos de leviatãs, krakens e criaturas adormecidas nas profundezas dos oceanos. Invocam tentáculos monstruosos, dominam as águas e carregam consigo o terror das criaturas que jamais deveriam alcançar a superfície.", "Caldeirão de Todas as Coisas de Tasha (2020).", "Bruxo", "🦑"],
["g2", "Patrono Gênio", "Mortais que conquistaram os favores de poderosos soberanos dos planos elementais. Carregam receptáculos mágicos, dominam forças primordiais e, no auge de seu poder, tornam-se capazes de realizar feitos que beiram a realização dos próprios desejos.", "Caldeirão de Todas as Coisas de Tasha (2020).", "Bruxo", "🧞"],
["g1", "Domínio da Guerra", "Campeões divinos que transformam campos de batalha em templos de suas divindades. Seus golpes são guiados pelo poder sagrado, e suas bênçãos permitem que guerreiros comuns realizem feitos dignos de lendas.", "Livro do Jogador (2014 e 2024).", "Clérigo", "⚔️"],
["g1", "Domínio da Luz", "Portadores da luz divina, capazes de transformar a noite em dia e reduzir exércitos de criaturas profanas a cinzas. Suas chamas sagradas são manifestações da ira celestial contra aqueles que habitam as trevas.", "Livro do Jogador (2014 e 2024).", "Clérigo", "☀️"],
["g1", "Domínio da Trapaça", "Seguidores de divindades que desprezam regras e desafiam autoridades. Suas ilusões enganam os olhos dos mortais, suas bênçãos ocultam aventureiros e seus duplicados fazem inimigos questionarem a própria realidade.", "Livro do Jogador (2014 e 2024).", "Clérigo", "🃏"],
["g1", "Domínio da Vida", "Guardadores da chama da existência, capazes de fechar ferimentos devastadores e arrancar seus companheiros das garras da morte. Enquanto outros sacerdotes espalham destruição, esses clérigos desafiam a própria mortalidade.", "Livro do Jogador (2014 e 2024).", "Clérigo", "💖"],
["g5", "Domínio do Conhecimento", "Guardiões dos segredos dos deuses, detentores de conhecimentos que civilizações inteiras esqueceram. Suas divindades lhes concedem poderes capazes de desvendar mistérios, penetrar mentes e revelar verdades ocultas.", "Forgotten Realms: Heroes of Faerûn (2025). Originalmente publicado no Livro do Jogador (2014).", "Clérigo", "📜"],
["g5", "Domínio Arcano", "Sacerdotes das divindades que governam a própria magia. Unem os milagres dos deuses aos conhecimentos dos arquimagos, tornando-se capazes de manipular forças arcanas que poucos mortais ousariam compreender.", "Arcana Unleashed (2026). Originalmente publicado no Guia do Aventureiro da Costa da Espada (2015).", "Clérigo", "🔮"],
["g5", "Domínio da Sepultura", "Guardiões do equilíbrio entre a existência e o descanso eterno. Não temem a morte, mas desprezam aqueles que profanam seu ciclo natural. Possuem o poder de salvar os moribundos e condenar seus inimigos ao fim inevitável.", "Ravenloft: The Horrors Within (2026). Originalmente publicado no Guia de Xanathar para Todas as Coisas (2017).", "Clérigo", "⚰️"],
["g2", "Domínio da Natureza", "Sacerdotes das divindades que governam florestas, animais e forças naturais. Suas preces despertam a vegetação, acalmam feras e manifestam a ira divina através dos elementos da natureza.", "Livro do Jogador (2014).", "Clérigo", "🌲"],
["g2", "Domínio da Tempestade", "Sacerdotes que carregam a violência dos céus em suas mãos. Invocam trovões ensurdecedores, relâmpagos devastadores e tempestades capazes de fazer até os maiores guerreiros tremerem diante da ira divina.", "Livro do Jogador (2014).", "Clérigo", "⛈️"],
["g2", "Domínio da Morte", "Devotos das divindades que governam a morte, o assassinato e a energia negativa. Seus toques destroem a vitalidade dos mortais, e seus poderes transformam a própria decadência em uma arma sobrenatural.", "Livro do Mestre (2014).", "Clérigo", "☠️"],
["g2", "Domínio da Forja", "Sacerdotes que encontram o poder divino nas chamas das fornalhas e no estrondo dos martelos. Suas bênçãos transformam metais comuns em equipamentos encantados, enquanto seus corpos se tornam resistentes como aço temperado.", "Guia de Xanathar para Todas as Coisas (2017).", "Clérigo", "🔨"],
["g2", "Domínio da Ordem", "Representantes da autoridade divina, defensores das leis e da disciplina absoluta. Suas palavras carregam tamanha autoridade sobrenatural que aliados atacam ao receber suas ordens e inimigos se curvam diante de seus comandos.", "Guia do Mestre de Guilda para Ravnica (2018) e Caldeirão de Todas as Coisas de Tasha (2020).", "Clérigo", "⚖️"],
["g2", "Domínio da Paz", "Emissários divinos da harmonia, capazes de estabelecer vínculos sobrenaturais entre companheiros. Sua presença transforma indivíduos comuns em uma irmandade praticamente inseparável, cuja força nasce da cooperação e da confiança.", "Caldeirão de Todas as Coisas de Tasha (2020).", "Clérigo", "🕊️"],
["g2", "Domínio do Crepúsculo", "Protetores daqueles que atravessam a escuridão, guardiões do descanso e da fronteira entre a luz e as sombras. Sua presença transforma a noite mais aterrorizante em um refúgio sobrenatural para seus companheiros.", "Caldeirão de Todas as Coisas de Tasha (2020).", "Clérigo", "🌆"],
["g3", "Domínio da Disciplina", "Sacerdotes que dominam simultaneamente a luz e as trevas, transformando a destruição de seus inimigos na salvação de seus companheiros. Cada ferimento provocado pode representar uma vida restaurada.", "D&D: World of Warcraft (2026).", "Clérigo", "🙏"],
["g3", "Domínio das Sombras", "Sacerdotes que mergulharam nas profundezas da escuridão em busca de poder. Destroem mentes, drenam a vitalidade dos inimigos e abandonam temporariamente suas formas físicas para se tornarem manifestações vivas das sombras.", "D&D: World of Warcraft (2026).", "Clérigo", "🌑"],
["g6", "Domínio da Ambição", "Sacerdotes que acreditam que a grandeza pertence àqueles que possuem coragem para conquistá-la. Manipulam adversários, enfraquecem seus ataques e utilizam ilusões para alcançar seus objetivos.", "Plane Shift: Amonkhet (2017).", "Clérigo", "👑"],
["g6", "Domínio da Solidariedade", "Sacerdotes cuja força nasce da união entre companheiros. Inspiram guerreiros a permanecerem juntos e transformam a cooperação em uma poderosa arma divina.", "Plane Shift: Amonkhet (2017).", "Clérigo", "🤝"],
["g6", "Domínio da Força", "Campeões divinos que glorificam a força e a perfeição corporal. Seus músculos carregam bênçãos sobrenaturais, permitindo realizar proezas físicas extraordinárias.", "Plane Shift: Amonkhet (2017).", "Clérigo", "💪"],
["g6", "Domínio do Zelo", "Fanáticos religiosos cuja devoção se manifesta através de explosões de fogo e poder destrutivo. Marcham contra seus inimigos com tamanha determinação que até a morte pode desencadear um último ataque devastador.", "Plane Shift: Amonkhet (2017).", "Clérigo", "🔥"],
["g1", "Abjurador", "Mestres das barreiras arcanas, capazes de transformar palavras e símbolos em fortalezas sobrenaturais. Desfazem maldições, neutralizam feitiços e resistem a poderes que destruiriam conjuradores comuns.", "Livro do Jogador (2014 e 2024).", "Mago", "🛡️"],
["g1", "Adivinhador", "Conjuradores capazes de enxergar acontecimentos antes mesmo que ocorram. Para eles, o futuro não é um mistério absoluto, mas uma possibilidade que pode ser observada e manipulada em benefício próprio.", "Livro do Jogador (2014 e 2024).", "Mago", "🔮"],
["g1", "Evocador", "Verdadeiras armas de guerra ambulantes, capazes de invocar incêndios colossais, tempestades elétricas e explosões devastadoras. Um evocador experiente pode transformar um exército inteiro em cinzas sem ferir seus próprios companheiros.", "Livro do Jogador (2014 e 2024).", "Mago", "🔥"],
["g1", "Ilusionista", "Mestres da percepção, capazes de fazer inimigos temerem monstros inexistentes, esconderem exércitos diante de olhos atentos e transformarem mentiras em manifestações tangíveis. Para um ilusionista, a realidade é apenas uma questão de perspectiva.", "Livro do Jogador (2014 e 2024).", "Mago", "🎭"],
["g5", "Cantor das Lâminas (Bladesinger)", "Guerreiros arcanos que transformam o combate em uma dança mortal. Suas lâminas acompanham o ritmo de suas magias, enquanto seus movimentos elegantes desafiam a velocidade e a precisão dos maiores espadachins.", "Forgotten Realms: Heroes of Faerûn (2025). Originalmente publicado no Guia do Aventureiro da Costa da Espada (2015) e revisado no Caldeirão de Tasha (2020).", "Mago", "🗡️"],
["g5", "Conjurador", "Manipuladores das fronteiras entre os planos da existência. Invocam criaturas sobrenaturais, atravessam distâncias impossíveis e trazem ao mundo forças que jamais deveriam abandonar seus planos de origem.", "Arcana Unleashed (2026). Originalmente publicado no Livro do Jogador (2014).", "Mago", "🌀"],
["g5", "Encantador", "Conjuradores cuja maior arma é a consciência de seus próprios inimigos. Podem transformar adversários em aliados, destruir vontades e subjugar indivíduos poderosos sem derramar uma única gota de sangue.", "Arcana Unleashed (2026). Originalmente publicado no Livro do Jogador (2014).", "Mago", "💫"],
["g5", "Necromante", "Estudiosos que ousaram desvendar os mistérios proibidos da morte. Onde outros enxergam cadáveres, necromantes enxergam soldados, servos e instrumentos de poder. Para eles, morrer não significa necessariamente deixar de servir.", "Arcana Unleashed (2026). Originalmente publicado no Livro do Jogador (2014).", "Mago", "💀"],
["g5", "Transmutador", "Manipuladores da matéria que se recusam a aceitar as leis naturais. Transformam substâncias, alteram corpos e concedem propriedades extraordinárias a criaturas comuns. Em suas mãos, a própria composição do mundo torna-se maleável.", "Arcana Unleashed (2026). Originalmente publicado no Livro do Jogador (2014).", "Mago", "⚗️"],
["g2", "Magia de Guerra", "Conjuradores treinados para sobreviver aos horrores da guerra. Com reflexos extraordinários e defesas arcanas instantâneas, conseguem resistir a ataques devastadores enquanto mantêm suas magias ativas no coração do campo de batalha.", "Guia de Xanathar para Todas as Coisas (2017).", "Mago", "⚔️"],
["g2", "Magia de Cronurgia", "Conjuradores que desafiam uma das forças mais fundamentais da existência: o tempo. Manipulam acontecimentos, aprisionam criaturas em instantes congelados e interferem em resultados que deveriam ser inevitáveis.", "Guia do Explorador para Wildemount (2020).", "Mago", "⏳"],
["g2", "Magia de Graviturgia (Graviturgy Magic)", "Estudiosos que dominam a força invisível responsável por manter mundos e estrelas em equilíbrio. Alteram o peso das criaturas, intensificam quedas e transformam a gravidade em uma prisão da qual seus inimigos dificilmente conseguem escapar.", "Guia do Explorador para Wildemount (2020).", "Mago", "🪐"],
["g2", "Ordem dos Escribas", "Eruditos tão profundamente conectados ao conhecimento arcano que seus próprios grimórios despertam para a existência. Reescrevem as propriedades dos feitiços e transformam livros aparentemente comuns em instrumentos de poder extraordinário.", "Caldeirão de Todas as Coisas de Tasha (2020).", "Mago", "📖"],
["g1", "Guerreiro da Mão Aberta", "Combatentes que alcançaram tamanha perfeição corporal que seus punhos se tornam mais perigosos que espadas. Seus golpes derrubam gigantes, arremessam adversários e provocam vibrações capazes de destruir criaturas de dentro para fora.", "Livro do Jogador (2014 e 2024).", "Monge", "🖐️"],
["g1", "Guerreiro da Misericórdia", "Mestres dos segredos do corpo, capazes de restaurar a vitalidade com um toque ou destruir um organismo com precisão aterrorizante. Suas mãos representam tanto a salvação dos feridos quanto a condenação dos inimigos.", "Livro do Jogador (2024). Originalmente publicado no Caldeirão de Todas as Coisas de Tasha (2020).", "Monge", "🩹"],
["g1", "Guerreiro das Sombras", "Assassinos que fizeram da escuridão seu verdadeiro lar. Desaparecem diante dos olhos de seus inimigos, atravessam sombras como portais e atacam com tamanha precisão que sua existência se torna apenas um rumor.", "Livro do Jogador (2014 e 2024).", "Monge", "🥷"],
["g1", "Guerreiro dos Elementos", "Guerreiros que transformaram seus corpos em condutores das forças primordiais. Seus punhos carregam chamas, gelo e relâmpagos, enquanto seus movimentos despertam explosões elementais capazes de devastar o campo de batalha.", "Livro do Jogador (2024). Reformulação do Caminho dos Quatro Elementos (2014).", "Monge", "🌊"],
["g5", "Guerreiro das Artes Místicas", "Artistas marciais que uniram o domínio do corpo aos segredos da magia arcana. Entre socos e chutes devastadores, conjuram feitiços extraordinários, tornando impossível prever se seu próximo ataque será uma técnica marcial ou uma explosão mágica.", "Arcana Unleashed (2026).", "Monge", "✨"],
["g3", "Guerreiro das Bebidas Místicas", "Combatentes cujos movimentos aparentemente desajeitados escondem uma técnica marcial extraordinária. Produzem bebidas sobrenaturais, desviam de golpes como se estivessem tropeçando e transformam o caos de uma batalha em uma dança imprevisível.", "D&D: World of Warcraft (2026). Reformulação do Caminho do Mestre Bêbado.", "Monge", "🍺"],
["g2", "Caminho da Morte Longa", "Guerreiros obcecados pelos segredos da morte, capazes de absorver a vitalidade daqueles que derrotam. Sua presença desperta terror, e sua compreensão da mortalidade permite que continuem lutando mesmo quando seus corpos deveriam ter sucumbido.", "Guia do Aventureiro da Costa da Espada (2015).", "Monge", "☠️"],
["g2", "Caminho do Mestre Bêbado", "Artistas marciais que transformam movimentos aparentemente descontrolados em técnicas de combate brilhantes. Tropeçam entre adversários, desviam de golpes impossíveis e fazem seus inimigos atacarem uns aos outros.", "Guia de Xanathar para Todas as Coisas (2017).", "Monge", "🍶"],
["g2", "Caminho do Kensei", "Guerreiros que dedicaram suas vidas à perfeição de suas lâminas. Tratam suas armas como extensões da própria alma, executando golpes de precisão extraordinária e alcançando um domínio marcial que poucos espadachins conseguem compreender.", "Guia de Xanathar para Todas as Coisas (2017).", "Monge", "🗡️"],
["g2", "Caminho da Alma Solar", "Artistas marciais que aprenderam a manifestar sua energia interior como luz devastadora. Disparam rajadas radiantes através das mãos e concentram seu poder em esferas luminosas capazes de explodir como pequenos sóis.", "Guia do Aventureiro da Costa da Espada (2015) e Guia de Xanathar para Todas as Coisas (2017).", "Monge", "☀️"],
["g2", "Caminho do Eu Astral", "Guerreiros que descobriram como projetar suas próprias almas no mundo físico. Manifestam braços, rostos e corpos espirituais gigantescos, combatendo através de uma representação sobrenatural de sua verdadeira essência.", "Caldeirão de Todas as Coisas de Tasha (2020).", "Monge", "👻"],
["g2", "Caminho do Dragão Ascendente", "Artistas marciais que buscaram a perfeição através das criaturas mais majestosas e aterrorizantes do mundo: os dragões. Seus punhos carregam poder elemental, suas bocas expelem sopros devastadores e de suas costas emergem asas dracônicas.", "Tesouro dos Dragões de Fizban (2021).", "Monge", "🐉"],
["g1", "Andarilho Feérico (Fey Wanderer)", "Caçadores tocados pela magia do mundo das fadas, cuja presença carrega uma beleza sobrenatural. Seus golpes ferem a mente, suas palavras encantam multidões e sua conexão com o reino feérico permite enfrentar criaturas que desafiam a razão.", "Livro do Jogador (2024). Originalmente publicado no Caldeirão de Todas as Coisas de Tasha (2020).", "Guardião (Patrulheiro)", "🧚"],
["g1", "Caçador (Hunter)", "Predadores supremos que estudam cada fraqueza de suas presas. Não importa se enfrentam um exército de goblins ou uma criatura colossal: sempre encontram uma maneira de transformar as vulnerabilidades de seus inimigos em vantagens mortais.", "Livro do Jogador (2014 e 2024).", "Guardião (Patrulheiro)", "🏹"],
["g1", "Senhor das Feras (Beast Master)", "Guerreiros que estabeleceram vínculos tão profundos com a natureza que suas feras se tornam verdadeiras extensões de suas almas. Nunca enfrentam uma batalha sozinhos, pois ao seu lado marcha um companheiro cuja lealdade supera o próprio instinto de sobrevivência.", "Livro do Jogador (2014 e 2024), com opções alternativas publicadas no Caldeirão de Tasha (2020).", "Guardião (Patrulheiro)", "🐺"],
["g1", "Vigilante das Sombras (Gloom Stalker)", "Caçadores que fizeram das profundezas mais aterrorizantes do mundo seu território. Movem-se como pesadelos invisíveis, atacam criaturas desprevenidas e utilizam a própria escuridão como uma arma contra aqueles que acreditam dominá-la.", "Livro do Jogador (2024). Originalmente publicado no Guia de Xanathar para Todas as Coisas (2017).", "Guardião (Patrulheiro)", "🌑"],
["g5", "Andarilho do Inverno (Winter Walker)", "Caçadores que sobreviveram aos invernos mais cruéis do mundo, transformando o frio mortal em sua maior arma. Seus golpes carregam o poder das nevascas, e nem mesmo criaturas acostumadas às temperaturas glaciais estão seguras diante deles.", "Forgotten Realms: Heroes of Faerûn (2025).", "Guardião (Patrulheiro)", "❄️"],
["g5", "Guardião do Vazio (Hollow Warden)", "Protetores dos lugares mais sombrios e esquecidos da natureza. Abandonam temporariamente suas formas mortais para se transformarem em criaturas de pesadelo, espalhando terror e consumindo a vitalidade daqueles que ousam invadir seus territórios.", "Ravenloft: The Horrors Within (2026).", "Guardião (Patrulheiro)", "🕳️"],
["g2", "Andarilho do Horizonte (Horizon Walker)", "Caçadores que patrulham as fronteiras entre os planos da existência. Atravessam dimensões, perseguem invasores extraplanares e desaparecem entre seus ataques, tornando-se guerreiros que desafiam as próprias limitações do espaço.", "Guia de Xanathar para Todas as Coisas (2017).", "Guardião (Patrulheiro)", "🌅"],
["g2", "Matador de Monstros (Monster Slayer)", "Especialistas em exterminar vampiros, demônios, dragões e outras criaturas que aterrorizam civilizações. Estudam as fraquezas de suas vítimas e desenvolvem técnicas capazes de neutralizar até mesmo seus poderes sobrenaturais.", "Guia de Xanathar para Todas as Coisas (2017).", "Guardião (Patrulheiro)", "🗡️"],
["g2", "Guardião do Enxame (Swarmkeeper)", "Guerreiros acompanhados por incontáveis criaturas espirituais que obedecem aos seus comandos. Borboletas, insetos, pequenos animais ou manifestações feéricas transformam-se em verdadeiras legiões capazes de atacar, proteger e transportar seu mestre.", "Caldeirão de Todas as Coisas de Tasha (2020).", "Guardião (Patrulheiro)", "🦋"],
["g2", "Guardião Dracônico (Drakewarden)", "Aventureiros que estabeleceram um vínculo extraordinário com a essência dos dragões. Seus companheiros começam como pequenas criaturas dracônicas e crescem até se tornarem poderosas montarias aladas, capazes de carregar seus mestres pelos céus e devastar inimigos com sopros elementais.", "Tesouro dos Dragões de Fizban (2021).", "Guardião (Patrulheiro)", "🐲"],
["g3", "Caçador de Demônios (Demon Hunter)", "Guerreiros que sacrificaram parte de sua própria humanidade para utilizar o poder daqueles que juraram exterminar. Consomem essências demoníacas, absorvem fragmentos de almas e transformam energias profanas em armas contra as criaturas do abismo.", "D&D: World of Warcraft (2026).", "Guardião (Patrulheiro)", "🦇"],
["g1", "Campeão (Champion)", "Combatentes que elevaram suas capacidades físicas a níveis extraordinários. Seus golpes encontram brechas impossíveis, sua resistência desafia os limites da mortalidade e sua determinação permite que continuem lutando quando outros já teriam sucumbido.", "Livro do Jogador (2014 e 2024).", "Guerreiro", "🏆"],
["g1", "Cavaleiro Místico (Eldritch Knight)", "Guerreiros que se recusaram a escolher entre a espada e a magia. Empunham armas em uma mão enquanto conjuram feitiços com a outra, protegendo-se com barreiras arcanas e castigando adversários com ataques sobrenaturais.", "Livro do Jogador (2014 e 2024).", "Guerreiro", "🔮"],
["g1", "Combatente Psíquico (Psi Warrior)", "Combatentes que desenvolveram capacidades mentais tão extraordinárias que seus pensamentos se tornaram armas. Movem objetos sem tocá-los, protegem companheiros com barreiras invisíveis e atingem adversários com a força esmagadora de suas mentes.", "Livro do Jogador (2024). Originalmente publicado no Caldeirão de Todas as Coisas de Tasha (2020).", "Guerreiro", "🧠"],
["g1", "Mestre da Batalha (Battle Master)", "Mestres absolutos da técnica marcial, capazes de analisar uma batalha como um tabuleiro de xadrez. Cada golpe possui um propósito, cada movimento cria uma oportunidade e cada erro cometido por seus adversários pode se tornar fatal.", "Livro do Jogador (2014 e 2024).", "Guerreiro", "♟️"],
["g5", "Porta-Estandarte (Banneret)", "Cavaleiros cuja coragem inspira exércitos inteiros. Sua presença no campo de batalha fortalece companheiros, restaura a determinação dos soldados e transforma aventureiros comuns em uma força militar formidável.", "Forgotten Realms: Heroes of Faerûn (2025). Reformulação do Cavaleiro do Dragão Púrpura, publicado no Guia do Aventureiro da Costa da Espada (2015).", "Guerreiro", "🚩"],
["g5", "Arqueiro Arcano (Arcane Archer)", "Arqueiros que aprenderam a aprisionar magia em seus projéteis. Suas flechas perseguem adversários, manifestam efeitos sobrenaturais e atingem criaturas que acreditavam estar perfeitamente protegidas.", "Arcana Unleashed (2026). Originalmente publicado no Guia de Xanathar para Todas as Coisas (2017).", "Guerreiro", "🏹"],
["g2", "Cavaleiro (Cavalier)", "Cavaleiros imponentes que transformam sua presença em uma muralha entre seus companheiros e o perigo. Desafiar um desses guerreiros significa enfrentar um adversário que pune brutalmente qualquer tentativa de atacar aqueles sob sua proteção.", "Guia de Xanathar para Todas as Coisas (2017).", "Guerreiro", "🐴"],
["g2", "Samurai", "Combatentes cuja disciplina e força de vontade superam as limitações de seus próprios corpos. Seus golpes são guiados por uma concentração absoluta, e nem mesmo ferimentos mortais conseguem interromper imediatamente sua determinação de lutar.", "Guia de Xanathar para Todas as Coisas (2017).", "Guerreiro", "⛩️"],
["g2", "Cavaleiro do Eco (Echo Knight)", "Guerreiros capazes de manifestar versões de si mesmos provenientes de possibilidades temporais não realizadas. Atacam de diferentes posições, trocam de lugar com seus próprios ecos e fazem seus inimigos enfrentarem um adversário que parece estar em vários lugares ao mesmo tempo.", "Guia do Explorador para Wildemount (2020).", "Guerreiro", "👥"],
["g2", "Cavaleiro Rúnico (Rune Knight)", "Combatentes que desvendaram os segredos das antigas runas dos gigantes. Seus equipamentos carregam poderes primordiais, seus corpos crescem até proporções colossais e suas inscrições mágicas são capazes de alterar o destino de uma batalha.", "Caldeirão de Todas as Coisas de Tasha (2020).", "Guerreiro", "ᚱ"],
["g7", "Cavaleiro da Tristeza (Sorrow Knight)", "Combatentes que transformaram suas tragédias e feridas emocionais em armas sobrenaturais. Seus golpes destroem a determinação dos inimigos, sua presença desperta terror e seus movimentos atravessam as sombras do próprio sofrimento.", "D&D Beyond Drops: Shadowfell Secrets, publicado em 1º de outubro de 2026. Subclasse digital oficial disponibilizada para assinantes do D&D Beyond, e não pertence a um livro físico.", "Guerreiro", "🥀"],
["g1", "Adaga Espiritual (Soulknife)", "Assassinos que transformam a força da própria mente em lâminas sobrenaturais. Não precisam carregar armas, pois seus pensamentos são instrumentos mortais, capazes de ferir a consciência dos inimigos sem deixar marcas físicas.", "Livro do Jogador (2024). Originalmente publicado no Caldeirão de Todas as Coisas de Tasha (2020).", "Ladino", "💠"],
["g1", "Assassino (Assassin)", "Predadores silenciosos que transformaram o assassinato em uma arte. Estudam suas vítimas, dominam venenos e atacam com precisão aterrorizante. Quando um assassino revela sua presença, normalmente já é tarde demais para seu alvo.", "Livro do Jogador (2014 e 2024).", "Ladino", "🗡️"],
["g1", "Ladrão (Thief)", "Especialistas em conquistar aquilo que deveria ser impossível de alcançar. Nenhuma muralha é alta demais, nenhuma fechadura é verdadeiramente segura e até o mais insignificante objeto pode se transformar em uma ferramenta extraordinária em suas mãos.", "Livro do Jogador (2014 e 2024).", "Ladino", "🗝️"],
["g1", "Trapaceiro Arcano (Arcane Trickster)", "Trapaceiros que descobriram que até as próprias leis da magia podem ser enganadas. Roubam objetos sem tocá-los, escondem-se através de ilusões e manipulam inimigos com feitiços que jamais esperariam encontrar nas mãos de um ladrão.", "Livro do Jogador (2014 e 2024).", "Ladino", "🎩"],
["g5", "Herdeiro dos Três (Scion of the Three)", "Executores marcados pelo poder de Bane, Bhaal e Myrkul, os três deuses da tirania, do assassinato e da morte. Alimentam-se do sofrimento de seus adversários, manifestando poderes divinos sombrios que transformam o medo em uma arma mortal.", "Forgotten Realms: Heroes of Faerûn (2025).", "Ladino", "🩸"],
["g5", "Fantasma (Phantom)", "Guerreiros que caminham na fronteira entre a vida e a morte. Colecionam fragmentos de almas, consultam os conhecimentos dos falecidos e transformam os lamentos dos mortos em armas. Em seu auge, nem mesmo paredes conseguem impedir sua passagem.", "Ravenloft: The Horrors Within (2026). Originalmente publicado no Caldeirão de Todas as Coisas de Tasha (2020).", "Ladino", "👻"],
["g3", "Espadachim (Swashbuckler)", "Combatentes extravagantes que transformam cada duelo em um espetáculo. Sua audácia é tão perigosa quanto suas lâminas, e sua velocidade permite atravessar campos de batalha, humilhar adversários e desafiar guerreiros muito maiores que eles.", "D&D: World of Warcraft (2026). Originalmente publicado no Guia do Aventureiro da Costa da Espada (2015) e no Guia de Xanathar (2017).", "Ladino", "🤺"],
["g2", "Inquisitivo (Inquisitive)", "Detetives cuja percepção ultrapassa a compreensão dos mortais comuns. Identificam mentiras, desvendam mistérios e estudam os movimentos de seus adversários com tamanha precisão que conseguem encontrar fraquezas aparentemente inexistentes.", "Guia de Xanathar para Todas as Coisas (2017).", "Ladino", "🔍"],
["g2", "Mentor (Mastermind)", "Manipuladores que transformam pessoas em peças de um gigantesco tabuleiro. Conhecem idiomas, imitam comportamentos e utilizam informações como armas. Muitas vezes, seus inimigos são derrotados sem sequer descobrir quem arquitetou sua queda.", "Guia do Aventureiro da Costa da Espada (2015) e Guia de Xanathar para Todas as Coisas (2017).", "Ladino", "🧩"],
["g2", "Batedor (Scout)", "Predadores das terras selvagens que se movimentam com velocidade e precisão extraordinárias. Conhecem cada trilha, identificam ameaças antes de seus companheiros e conseguem atacar inimigos sem permitir que eles se aproximem.", "Guia de Xanathar para Todas as Coisas (2017).", "Ladino", "🧭"],
["g1", "Juramento da Devoção (Oath of Devotion)", "Cavaleiros que representam os maiores ideais de honra, coragem e justiça. Suas espadas brilham com poder sagrado, sua presença repele a corrupção e sua determinação permanece inabalável diante das forças do mal.", "Livro do Jogador (2014 e 2024).", "Paladino", "🛡️"],
["g1", "Juramento dos Anciões (Oath of the Ancients)", "Cavaleiros que protegem a beleza, a esperança e a vida contra as forças que desejam extingui-las. Carregam a magia das antigas florestas, aprisionam inimigos com raízes sobrenaturais e resistem às energias mais destrutivas do universo.", "Livro do Jogador (2014 e 2024).", "Paladino", "🌳"],
["g1", "Juramento da Glória (Oath of Glory)", "Heróis que buscam eternizar seus nomes através de proezas impossíveis. Saltam sobre obstáculos, enfrentam criaturas colossais e inspiram seus companheiros a ultrapassar os próprios limites, transformando aventuras em verdadeiras epopeias.", "Livro do Jogador (2024), Odisseias Míticas de Theros (2020) e Caldeirão de Todas as Coisas de Tasha (2020).", "Paladino", "🏛️"],
["g1", "Juramento da Vingança (Oath of Vengeance)", "Guerreiros que abandonaram o conforto e a misericórdia para perseguir aqueles que consideram responsáveis por grandes injustiças. Nenhuma distância é suficiente para escapar de sua perseguição, e nenhuma fortaleza consegue deter sua determinação.", "Livro do Jogador (2014 e 2024).", "Paladino", "🔥"],
["g5", "Juramento dos Gênios Nobres (Oath of the Noble Genies)", "Campeões que carregam a majestade dos soberanos dos Planos Elementais. Seus corpos manifestam a força da terra, a liberdade dos ventos, a violência das chamas e a fluidez dos oceanos.", "Forgotten Realms: Heroes of Faerûn (2025).", "Paladino", "🧞"],
["g3", "Juramento da Luz Sagrada (Oath of the Holy)", "Campeões cuja luz divina restaura aqueles que foram devastados pela crueldade do mundo. Cada inimigo derrotado representa uma nova oportunidade de salvar vidas, e sua presença transforma campos de batalha em santuários de esperança.", "D&D: World of Warcraft (2026).", "Paladino", "🕊️"],
["g3", "Juramento da Lâmina de Ébano (Oath of the Ebon Blade)", "Guerreiros que dominaram os poderes da morte, do sangue e do inverno eterno. Suas armas carregam runas profanas, seus golpes consomem a vitalidade dos inimigos e suas magias despertam criaturas que deveriam permanecer enterradas.", "D&D: World of Warcraft (2026).", "Paladino", "💀"],
["g2", "Juramento da Coroa (Oath of the Crown)", "Cavaleiros cuja lealdade representa os pilares de uma civilização. Defendem governantes, protegem cidadãos e sustentam as leis que impedem o mundo de mergulhar no caos. Seus corpos são escudos vivos diante daqueles que juraram proteger.", "Guia do Aventureiro da Costa da Espada (2015).", "Paladino", "👑"],
["g2", "Juramento da Conquista (Oath of Conquest)", "Guerreiros cuja presença é suficiente para fazer exércitos abandonarem suas armas. Acreditam que a ordem nasce da força absoluta e que a verdadeira vitória não consiste apenas em derrotar inimigos, mas em destruir sua vontade de resistir.", "Guia de Xanathar para Todas as Coisas (2017).", "Paladino", "🏰"],
["g2", "Juramento da Redenção (Oath of Redemption)", "Cavaleiros que acreditam que até mesmo a mais terrível das criaturas pode encontrar redenção. Preferem suportar ferimentos a permitir o sofrimento dos inocentes, utilizando palavras, sacrifícios e poder divino para impedir conflitos desnecessários.", "Guia de Xanathar para Todas as Coisas (2017).", "Paladino", "🤲"],
["g2", "Juramento dos Vigilantes (Oath of the Watchers)", "Sentinelas que vigiam as fronteiras da existência, impedindo que demônios, aberrações e entidades extraplanares destruam os reinos mortais. Suas mentes são fortalezas contra manipulações sobrenaturais, e seus poderes expulsam criaturas que jamais deveriam ter chegado ao mundo.", "Caldeirão de Todas as Coisas de Tasha (2020).", "Paladino", "👁️"],
["g2", "Quebrador de Juramento (Oathbreaker)", "Cavaleiros que abandonaram seus juramentos em busca de ambições sombrias. Onde antes brilhava a luz divina, agora habitam medo, corrupção e morte. Sua presença fortalece criaturas profanas, enquanto sua autoridade sobrenatural submete os mortos à sua vontade.", "Livro do Mestre (2014).", "Paladino", "🖤"],
["g8", "Juramento dos Mares Abertos (Oath of the Open Sea)", "Cavaleiros que juraram defender a liberdade dos viajantes e explorar os infinitos horizontes dos oceanos. Invocam névoas sobrenaturais, manipulam correntes marítimas e enfrentam aqueles que desejam acorrentar o espírito livre dos mortais.", "Tal'Dorei Campaign Setting Reborn (2022), de Critical Role e Darrington Press.", "Paladino", "⚓"]
,["g1", "Feitiçaria Dracônica (Draconic Sorcery)", "Mortais que carregam em seu interior a majestade e o poder destrutivo dos dragões. Seus corpos desenvolvem características dracônicas, suas magias manifestam energias elementais e, no auge de seu poder, tornam-se capazes de invocar essas criaturas lendárias.", "Livro do Jogador (2014 e 2024).", "Feiticeiro", "🐉"],
["g1", "Feitiçaria da Magia Selvagem (Wild Magic Sorcery)", "Conjuradores cuja existência desafia as próprias leis da magia. Cada feitiço pode desencadear acontecimentos extraordinários, desde explosões devastadoras até transformações absurdas. Nem mesmo eles compreendem completamente o poder que carregam.", "Livro do Jogador (2014 e 2024).", "Feiticeiro", "🎲"],
["g1", "Feitiçaria Aberrante (Aberrant Sorcery)", "Indivíduos contaminados por forças alienígenas que existem além da compreensão mortal. Seus pensamentos atravessam consciências, seus corpos assumem formas impossíveis e suas magias carregam o poder das entidades que habitam os confins da realidade.", "Livro do Jogador (2024). Originalmente publicado como Mente Aberrante no Caldeirão de Todas as Coisas de Tasha (2020).", "Feiticeiro", "🐙"],
["g1", "Feitiçaria Mecânica (Clockwork Sorcery)", "Conjuradores conectados às forças cósmicas que sustentam a ordem do universo. Para eles, a realidade funciona como uma engrenagem colossal, cujas falhas podem ser corrigidas através da magia. São capazes de neutralizar o caos e impor equilíbrio até mesmo às batalhas mais desesperadoras.", "Livro do Jogador (2024). Originalmente publicado como Alma Mecânica no Caldeirão de Todas as Coisas de Tasha (2020).", "Feiticeiro", "⚙️"],
["g5", "Feitiçaria do Fogo Mágico (Spellfire Sorcery)", "Mortais capazes de canalizar diretamente a energia da Trama, a força que sustenta a magia. Seus corpos absorvem feitiços, suas chamas restauram companheiros e suas explosões luminosas destroem aqueles que ousam desafiá-los.", "Forgotten Realms: Heroes of Faerûn (2025).", "Feiticeiro", "🔥"],
["g5", "Feitiçaria das Sombras (Shadow Sorcery)", "Conjuradores cuja alma foi tocada pelas forças do Pendor das Sombras. Seus corpos resistem à morte, seus movimentos atravessam a escuridão e sua magia desperta criaturas feitas dos pesadelos mais profundos dos mortais.", "Ravenloft: The Horrors Within (2026). Originalmente publicado como Magia das Sombras no Guia de Xanathar para Todas as Coisas (2017).", "Feiticeiro", "🌑"],
["g2", "Alma Divina (Divine Soul)", "Mortais cuja existência carrega uma centelha do poder divino. Seus dons permitem realizar milagres, restaurar vidas e manifestar poderes que normalmente seriam reservados aos sacerdotes. Suas almas representam a união entre a magia arcana e a divina.", "Guia de Xanathar para Todas as Coisas (2017).", "Feiticeiro", "😇"],
["g2", "Feitiçaria da Tempestade (Storm Sorcery)", "Conjuradores que carregam em seus corpos a violência das tempestades. Seus movimentos acompanham os ventos, seus feitiços despertam trovões ensurdecedores e sua presença manifesta a fúria dos céus.", "Guia do Aventureiro da Costa da Espada (2015) e Guia de Xanathar para Todas as Coisas (2017).", "Feiticeiro", "⛈️"],
["g2", "Feitiçaria Lunar (Lunar Sorcery)", "Mortais conectados aos ciclos lunares, cujos poderes se transformam conforme as manifestações da lua. Canalizam a luz da lua cheia, os mistérios da lua nova e o equilíbrio da lua crescente, adaptando sua magia às necessidades de cada batalha.", "Dragonlance: Shadow of the Dragon Queen — A Sombra da Rainha Dragão (2022).", "Feiticeiro", "🌙"],
["g10", "Evocador Dracônico (Evoker)", "Conjuradores que canalizam os poderes das grandes linhagens dracônicas de Azeroth. Podem devastar seus inimigos com energias primordiais, restaurar a vitalidade de seus companheiros ou ampliar sobrenaturalmente as capacidades de outros combatentes.", "D&D: World of Warcraft (2026).", "Feiticeiro", "🐲"],
["g1", "Círculo da Terra (Circle of the Land)", "Sábios que estabeleceram uma conexão profunda com os diferentes territórios do mundo. Carregam consigo a violência dos desertos, os mistérios das florestas e o poder das regiões congeladas, transformando a natureza em uma fonte inesgotável de conhecimento mágico.", "Livro do Jogador (2014 e 2024).", "Druida", "🌍"],
["g1", "Círculo da Lua (Circle of the Moon)", "Guerreiros que abandonam suas formas mortais para assumir a aparência das criaturas mais ferozes da natureza. Transformam-se em ursos, lobos e monstros selvagens, tornando seus próprios corpos armas vivas contra aqueles que ameaçam o equilíbrio natural.", "Livro do Jogador (2014 e 2024).", "Druida", "🐻"],
["g1", "Círculo das Estrelas (Circle of the Stars)", "Astrólogos que descobriram os segredos escondidos nas constelações. Seus corpos tornam-se manifestações luminosas do céu noturno, e seus poderes permitem interpretar presságios, disparar flechas estelares e restaurar a vitalidade de seus companheiros.", "Livro do Jogador (2024). Originalmente publicado no Caldeirão de Todas as Coisas de Tasha (2020).", "Druida", "⭐"],
["g1", "Círculo do Mar (Circle of the Sea)", "Portadores da fúria dos oceanos, capazes de envolver seus corpos em ondas sobrenaturais e tempestades devastadoras. Seus inimigos são arrastados por correntes violentas, enquanto seus companheiros encontram proteção contra os elementos.", "Livro do Jogador (2024).", "Druida", "🌊"],
["g2", "Círculo dos Sonhos (Circle of Dreams)", "Guardiões dos lugares onde os sonhos encontram a realidade. Carregam a magia dos reinos feéricos, restauram a esperança daqueles que sofrem e transformam locais de descanso em refúgios sobrenaturais contra os perigos do mundo.", "Guia de Xanathar para Todas as Coisas (2017).", "Druida", "💤"],
["g2", "Círculo do Pastor (Circle of the Shepherd)", "Protetores das criaturas selvagens que jamais enfrentam uma batalha sozinhos. Seus chamados despertam espíritos ancestrais, convocam feras e transformam animais aparentemente indefesos em verdadeiros exércitos da natureza.", "Guia de Xanathar para Todas as Coisas (2017).", "Druida", "🐑"],
["g2", "Círculo dos Esporos (Circle of Spores)", "Conjuradores que compreendem que a morte não representa o fim da natureza, mas o início de um novo ciclo. Seus corpos abrigam fungos sobrenaturais, seus esporos consomem a vitalidade dos inimigos e os cadáveres tornam-se hospedeiros de novas manifestações de vida.", "Guia do Mestre de Guilda para Ravnica (2018) e Caldeirão de Todas as Coisas de Tasha (2020).", "Druida", "🍄"],
["g2", "Círculo do Fogo Selvagem (Circle of Wildfire)", "Guardiões que reconhecem o fogo como uma força essencial da natureza. Compreendem que florestas podem renascer das cinzas e que a destruição pode preparar o caminho para uma nova vida. Ao seu lado marcham espíritos flamejantes capazes tanto de destruir quanto de salvar.", "Caldeirão de Todas as Coisas de Tasha (2020).", "Druida", "🔥"],
["g10", "Druida Feral (Feral)", "Caçadores selvagens que assumem formas felinas, atacando com velocidade, ferocidade e precisão. Seus inimigos são presas diante de suas garras mortais.", "D&D: World of Warcraft (2026). Variante do Círculo da Lua.", "Druida", "🐆"],
["g10", "Druida Guardião (Guardian)", "Protetores que assumem formas ursinas poderosas, transformando seus corpos em muralhas vivas entre seus companheiros e os perigos da natureza.", "D&D: World of Warcraft (2026). Variante do Círculo da Lua.", "Druida", "🛡️"],
["g4", "Círculo da Preservação (Circle of Preservation)", "Guardiões dos últimos fragmentos de vida em mundos devastados. Utilizam sua magia para restaurar terras destruídas e proteger aqueles que ainda resistem em ambientes hostis.", "Unearthed Arcana: Apocalyptic Subclasses (2025).", "Druida", "🌱"],
["g4", "Círculo do Titã (Circle of the Titan)", "Quando civilizações ameaçam destruir o mundo natural, esses druidas abandonam suas formas mortais e tornam-se manifestações monstruosas da ira da natureza. Seus corpos assumem características de criaturas capazes de aterrorizar cidades inteiras.", "Unearthed Arcana: Villainous Options (2026), posteriormente revisado em Villainous Options Revisited.", "Druida", "🦖"],
["g9", "Alquimista (Alchemist)", "Cientistas arcanos capazes de engarrafar milagres. Transformam ingredientes aparentemente insignificantes em substâncias extraordinárias, produzem medicamentos sobrenaturais e manipulam reações químicas capazes tanto de restaurar vidas quanto de destruir seus inimigos.", "Eberron: Das Cinzas da Última Guerra (2019), Caldeirão de Tasha (2020) e Eberron: Forge of the Artificer (2025).", "Artífice", "⚗️"],
["g9", "Armeiro (Armorer)", "Inventores que transformam armaduras em verdadeiras extensões de seus corpos. Seus equipamentos carregam armas integradas, mecanismos sobrenaturais e sistemas defensivos capazes de transformar um simples mortal em uma máquina de guerra.", "Caldeirão de Todas as Coisas de Tasha (2020) e Eberron: Forge of the Artificer (2025).", "Artífice", "🦾"],
["g9", "Artilheiro (Artillerist)", "Engenheiros de guerra que transformaram a magia em poder de fogo. Constroem canhões sobrenaturais, fabricam instrumentos de destruição e bombardeiam seus inimigos com explosões capazes de mudar o rumo de uma batalha.", "Eberron: Das Cinzas da Última Guerra (2019), Caldeirão de Tasha (2020) e Eberron: Forge of the Artificer (2025).", "Artífice", "💣"],
["g9", "Ferreiro de Batalha (Battle Smith)", "Inventores que descobriram como conceder movimento e propósito ao metal. Suas armas são produtos de conhecimento extraordinário, enquanto seus companheiros mecânicos enfrentam monstros, protegem aliados e demonstram que até o aço pode carregar uma centelha de vida.", "Eberron: Das Cinzas da Última Guerra (2019), Caldeirão de Tasha (2020) e Eberron: Forge of the Artificer (2025).", "Artífice", "🤖"],
["g9", "Cartógrafo (Cartographer)", "Exploradores que descobriram como registrar não apenas os caminhos do mundo, mas também as possibilidades da própria realidade. Seus mapas revelam ameaças, orientam companheiros e transformam distâncias aparentemente intransponíveis em pequenos obstáculos.", "Eberron: Forge of the Artificer (2025).", "Artífice", "🗺️"],
["g5", "Reanimador (Reanimator)", "Cientistas que ousaram atravessar a fronteira entre a vida e a morte. Costuram carne, conectam ossos e utilizam conhecimentos arcanos para despertar criaturas que jamais deveriam voltar a respirar. Para esses inventores, a morte é apenas um problema científico ainda não resolvido.", "Ravenloft: The Horrors Within (2026).", "Artífice", "🧟"],
["g11", "Boxing (Boxe)", "Combatentes que transformam seus punhos em armas de destruição, capazes de nocautear adversários através de golpes precisos e sequências devastadoras.", "Guia de Xyleff Sualky, páginas 25–27.", "Lutador", "🥊"],
["g11", "Muay Thai", "Guerreiros que utilizam punhos, cotovelos, joelhos e pernas para destruir adversários através de uma combinação de resistência e brutalidade.", "Guia de Xyleff Sualky, páginas 25–27.", "Lutador", "🦵"],
["g11", "Capoeira", "Artistas marciais que transformam música, dança e acrobacias em uma técnica de combate imprevisível.", "Guia de Xyleff Sualky, páginas 25–27.", "Lutador", "🎶"],
["g11", "Jiu-Jitsu", "Combatentes capazes de derrotar adversários fisicamente superiores através de alavancas, imobilizações e controle corporal.", "Guia de Xyleff Sualky, páginas 25–27.", "Lutador", "🥋"],
["g11", "Açougueiro", "Especialistas em anatomia monstruosa que transformam seus cutelos em armas mortais e conhecem os melhores cortes de cada criatura.", "Guia de Xyleff Sualky, páginas 35–38.", "Cozinheiro", "🔪"],
["g11", "Exótico", "Cozinheiros que ultrapassam os limites da gastronomia convencional, utilizando criaturas e ingredientes extraordinários para produzir refeições sobrenaturais.", "Guia de Xyleff Sualky, páginas 35–38.", "Cozinheiro", "🦑"],
["g11", "Mixologista", "Alquimistas gastronômicos capazes de transformar líquidos comuns, poções e essências monstruosas em bebidas extraordinárias.", "Guia de Xyleff Sualky, páginas 35–38.", "Cozinheiro", "🍹"],
["g11", "Hell’s Kitchen", "Chefs que descobriram os segredos culinários dos infernos, utilizando chamas sobrenaturais e conhecimentos demonológicos para preparar suas criações.", "Guia de Xyleff Sualky, páginas 35–38.", "Cozinheiro", "🔥"],
["g11", "Hematologista", "Médicos capazes de manipular a essência vital das criaturas, transportando sangue e vitalidade entre organismos.", "Guia de Xyleff Sualky, páginas 49–56.", "Curandeiro", "🩸"],
["g11", "Dr. Morte", "Cientistas que transformaram suas próprias enfermidades em instrumentos de poder, desenvolvendo mutações corporais e venenos extraordinários.", "Guia de Xyleff Sualky, páginas 49–56.", "Curandeiro", "🧪"],
["g11", "Farmacêutico", "Pesquisadores que desenvolveram substâncias capazes de realizar feitos que parecem verdadeiros milagres medicinais.", "Guia de Xyleff Sualky, páginas 49–56.", "Curandeiro", "💊"],
["g11", "Médico Clandestino", "Profissionais que operam nas sombras da sociedade, atendendo criminosos, mercenários e indivíduos perseguidos pelas autoridades. Suas conexões são tão valiosas quanto seus conhecimentos médicos.", "Guia de Xyleff Sualky, páginas 49–56.", "Curandeiro", "🕶️"],
["g11", "Personal Trainer", "Treinadores que transformam aventureiros comuns em verdadeiros atletas sobrenaturais através de exercícios, motivação e conhecimentos sobre o corpo.", "Guia de Xyleff Sualky, páginas 49–56.", "Curandeiro", "🏋️"],
["g11", "Clã do Vulto", "Assassinos que abandonaram os limites de seus corpos físicos, fundindo-se à escuridão e manifestando sua presença através das sombras.", "Guia de Xyleff Sualky, páginas 63–68.", "Shinobi", "🌑"],
["g11", "Clã dos Ossos", "Guerreiros capazes de transformar seus próprios esqueletos em arsenais vivos. Produzem armas, escudos e espinhos a partir de seus ossos.", "Guia de Xyleff Sualky, páginas 63–68.", "Shinobi", "🦴"],
["g11", "Clã Elemental", "Shinobis que aprenderam a canalizar as forças primordiais através de técnicas secretas. Seus ataques manifestam energias elementais, e seus corpos tornam-se resistentes às forças que dominam.", "Guia de Xyleff Sualky, páginas 63–68.", "Shinobi", "🌪️"],
["g11", "Clã do Selamento", "Especialistas em aprisionar criaturas, armazenar objetos em dimensões alternativas e impedir que adversários manifestem seus poderes sobrenaturais.", "Guia de Xyleff Sualky, páginas 63–68.", "Shinobi", "📜"],
["g11", "Apostador Sombrio", "Ocultistas que transformam a sorte e os desafios em instrumentos sobrenaturais, estabelecendo apostas cujas consequências podem ultrapassar os limites da própria vida.", "Guia de Xyleff Sualky, páginas 74–79.", "Xamã", "🎲"],
["g11", "Bestial", "Protetores que estabelecem vínculos profundos com animais, recebendo sua companhia, proteção e sabedoria ancestral.", "Guia de Xyleff Sualky, páginas 74–79.", "Xamã", "🐺"],
["g11", "Vodu", "Especialistas em talismãs e bonecos mágicos, capazes de estabelecer conexões espirituais com criaturas e influenciá-las à distância.", "Guia de Xyleff Sualky, páginas 74–79.", "Xamã", "🪆"],
