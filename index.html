"Cavaleiro (Cavalier)": ["O guerreiro defensor.", "Marca Inabalável — marca inimigos atingidos em combate corporal, prejudicando seus ataques contra outras criaturas e permitindo retaliar quando eles ferem seus aliados.", "Para interpretar um cavaleiro medieval, guarda-costas, defensor do reino ou guerreiro especializado em combate montado e proteção.", ["Proteção de aliados.", "Combate montado.", "Controle territorial.", "Ataques de oportunidade.", "Retaliação.", "Defesa da linha de frente."], ["Combate à distância.", "Conjuração.", "Cura.", "Furtividade.", "Enfrentar inimigos que evitam combate corporal."], ""],
"Samurai": ["O guerreiro da determinação.", "Espírito de Luta — concede vantagem às jogadas de ataque com armas durante o turno e pontos de vida temporários. Em níveis elevados, pode realizar ataques adicionais e até executar um turno extraordinário antes de cair inconsciente.", "Para interpretar um samurai, duelista honrado ou guerreiro cuja disciplina permite realizar ataques devastadores em momentos decisivos.", ["Precisão.", "Dano explosivo.", "Combate com armas.", "Enfrentar chefes.", "Resistência mental.", "Persuasão e etiqueta."], ["Proteção direta de aliados.", "Controle territorial.", "Cura.", "Conjuração.", "Quantidade limitada de usos do Espírito de Luta."], ""],
"Cavaleiro do Eco (Echo Knight)": ["O guerreiro das possibilidades.", "Manifestar Eco — cria uma manifestação mágica de si mesmo, permitindo atacar através de sua posição, trocar de lugar com ela e realizar ataques adicionais.", "Para interpretar um guerreiro dimensional, espadachim que utiliza duplicatas sobrenaturais ou combatente capaz de lutar através de manifestações alternativas de si mesmo.", ["Teletransporte.", "Controle territorial.", "Ataques adicionais.", "Mobilidade extraordinária.", "Reconhecimento de ambientes.", "Combate estratégico."], ["Cura.", "Conjuração convencional.", "Resistência do próprio eco.", "Economia de ações bônus.", "Simplicidade mecânica."], ""],
"Cavaleiro Rúnico (Rune Knight)": ["O guerreiro dos gigantes.", "Poder dos Gigantes e Entalhador de Runas — aumenta seu tamanho, fortalece capacidades físicas e utiliza runas mágicas com diferentes efeitos ofensivos, defensivos e utilitários.", "Para interpretar um guerreiro titânico, cavaleiro encantado, combatente rúnico ou aventureiro que carrega a força ancestral dos gigantes.", ["Força física.", "Agarrar criaturas.", "Controle territorial.", "Proteção de aliados.", "Versatilidade sobrenatural.", "Resistência individual."], ["Cura.", "Furtividade enquanto aumentado.", "Conjuração convencional.", "Gerenciamento de runas.", "Combate em espaços que dificultam seu crescimento."], ""],
"Cavaleiro da Tristeza (Sorrow Knight)": ["O guerreiro do desespero.", "Golpe do Desespero — utiliza dados especiais para acrescentar dano psíquico aos ataques e produzir efeitos sobrenaturais. Também desenvolve teletransporte sombrio e capacidades relacionadas ao medo.", "Para interpretar um cavaleiro atormentado, guerreiro amaldiçoado, sobrevivente de uma tragédia ou combatente que transforma sofrimento emocional em poder.", ["Dano psíquico.", "Causar medo.", "Teletransporte.", "Controle de inimigos.", "Mobilidade sobrenatural.", "Manipulação emocional."], ["Cura coletiva.", "Gerenciamento de recursos.", "Enfrentar imunidade psíquica.", "Enfrentar imunidade ao medo.", "Conjuração convencional."], ""],
"Adaga Espiritual (Soulknife)": ["O ladino psiônico.", "Lâminas Psíquicas — manifesta armas de energia mental que causam dano psíquico. Também utiliza dados de energia psiônica para melhorar testes de perícia, comunicar-se telepaticamente e desenvolver teletransporte.", "Para interpretar um assassino psiônico, agente sobrenatural ou guerreiro que utiliza sua própria mente como arma.", ["Dano psíquico.", "Telepatia.", "Furtividade.", "Testes de perícia.", "Teletransporte.", "Combate sem equipamentos."], ["Cura de aliados.", "Dano em grandes áreas.", "Resistência física.", "Enfrentar imunidade psíquica.", "Combate após esgotar recursos psiônicos."], ""],
"Assassino (Assassin)": ["O ladino executor.", "Assassinar — recebe vantagem na iniciativa e benefícios ofensivos durante a primeira rodada de combate contra criaturas que ainda não agiram. Também desenvolve técnicas avançadas de envenenamento e infiltração.", "Para interpretar um assassino profissional, mercenário silencioso ou agente secreto especializado em eliminar alvos prioritários.", ["Emboscadas.", "Iniciativa.", "Dano inicial.", "Envenenamento.", "Infiltração.", "Eliminar alvos individuais."], ["Combates prolongados.", "Proteção de aliados.", "Dano em área.", "Resistência física.", "Enfrentar imunidade a veneno."], "A versão de 2024 não possui os acertos críticos automáticos contra criaturas surpreendidas da versão de 2014."],
"Ladrão (Thief)": ["O ladino mestre da improvisação.", "Mãos Rápidas — permite realizar determinadas interações com objetos, utilizar ferramentas de ladrão e ativar certos itens mágicos como ação bônus. Também desenvolve capacidades superiores de escalada e utilização de equipamentos mágicos.", "Para interpretar um ladrão profissional, aventureiro explorador, saqueador de tumbas ou caçador de tesouros extremamente criativo.", ["Abrir fechaduras.", "Desarmar armadilhas.", "Escalada.", "Utilização de equipamentos.", "Improvisação.", "Exploração de masmorras."], ["Dano adicional exclusivo.", "Resistência física.", "Conjuração própria.", "Cura especializada.", "Aproveitar suas habilidades sem equipamentos úteis."], ""],
"Trapaceiro Arcano (Arcane Trickster)": ["O ladino mágico.", "Conjuração e Prestidigitação com Mãos Mágicas — aprende magias de Mago e manifesta uma mão mágica invisível capaz de manipular objetos e realizar determinadas tarefas furtivamente.", "Para interpretar um ladrão mágico, espião sobrenatural ou trapaceiro que combina inteligência, furtividade e conjuração arcana.", ["Ilusões.", "Furtividade mágica.", "Infiltração.", "Manipulação de objetos.", "Controle de inimigos.", "Versatilidade."], ["Conjuração de alto círculo.", "Dependência de múltiplos atributos.", "Cura especializada.", "Quantidade de espaços de magia.", "Resistência física prolongada."], ""],
"Herdeiro dos Três (Scion of the Three)": ["O ladino da violência divina.", "Sede de Sangue — permite se teletransportar até inimigos recentemente feridos e atacá-los. Também recebe resistências e poderes mágicos associados aos Três Mortos.", "Para interpretar um assassino religioso, campeão de uma divindade sombria ou guerreiro amaldiçoado semelhante aos seguidores de Bhaal em Baldur's Gate III.", ["Teletransporte.", "Dano adicional.", "Causar medo.", "Perseguir inimigos feridos.", "Resistências sobrenaturais.", "Ataques oportunistas."], ["Cura de aliados.", "Proteção coletiva.", "Enfrentar imunidade ao medo.", "Combate sem oportunidades para ativar seus poderes.", "Conjuração avançada."], ""],
"Fantasma (Phantom)": ["O ladino dos mortos.", "Lamentos da Sepultura — permite que o Ataque Furtivo também cause dano sobrenatural a um segundo inimigo próximo. Posteriormente, pode armazenar fragmentos de almas e assumir uma forma espectral.", "Para interpretar um assassino fantasmagórico, ladrão de almas ou aventureiro que adquiriu poderes através de uma experiência sobrenatural com a morte.", ["Dano necrótico.", "Combater múltiplos alvos.", "Perícias adaptáveis.", "Comunicação com os mortos.", "Infiltração sobrenatural.", "Sobrevivência."], ["Cura de aliados.", "Proteção coletiva.", "Enfrentar imunidade necrótica.", "Gerenciamento de fragmentos de almas.", "Dependência de níveis elevados para sua forma espectral."], ""],
"Espadachim (Swashbuckler)": ["O ladino duelista.", "Audácia Elegante — acrescenta Carisma à iniciativa e permite realizar Ataques Furtivos em determinadas situações de duelo individual. Também consegue escapar dos ataques de oportunidade de criaturas que atacou e desenvolver técnicas de provocação e defesa.", "Para interpretar um pirata, duelista elegante, aventureiro inspirado no Zorro ou espadachim carismático que prefere enfrentar seus adversários diretamente.", ["Duelos.", "Combate corporal.", "Mobilidade.", "Iniciativa.", "Persuasão.", "Ataque Furtivo independente de aliados."], ["Dano em grandes áreas.", "Cura.", "Resistência física prolongada.", "Conjuração.", "Dependência de Carisma para algumas habilidades."], ""],
"Inquisitivo (Inquisitive)": ["O ladino investigador.", "Combate Perspicaz — realiza um teste de Intuição contra a Enganação do adversário, permitindo utilizar Ataque Furtivo contra ele mesmo sem vantagem ou aliados próximos, desde que não tenha desvantagem.", "Para interpretar um detetive, investigador criminal, caçador de impostores ou personagem inspirado em Sherlock Holmes.", ["Investigação.", "Detectar mentiras.", "Percepção.", "Identificar ilusões.", "Analisar inimigos.", "Resolver mistérios."], ["Dano explosivo.", "Resistência física.", "Suporte direto em combate.", "Dependência de Sabedoria.", "Economia de ações bônus."], ""],
"Mentor (Mastermind)": ["O ladino estrategista.", "Mestre das Táticas — pode utilizar a ação Ajudar como ação bônus e auxiliar ataques de companheiros contra inimigos a uma distância maior que a convencional.", "Para interpretar um líder criminoso, estrategista, espião político ou comandante que prefere manipular acontecimentos nos bastidores.", ["Espionagem.", "Manipulação social.", "Suporte tático.", "Disfarces.", "Enganação.", "Trabalho em equipe."], ["Combate solitário.", "Dano adicional exclusivo.", "Resistência física.", "Cura.", "Aproveitar suas habilidades em campanhas sem intrigas."], ""],
"Batedor (Scout)": ["O ladino explorador.", "Escaramuçador — utiliza sua reação para se afastar de inimigos que terminam seus turnos próximos, sem provocar ataques de oportunidade. Também recebe especialização em Natureza e Sobrevivência.", "Para interpretar um arqueiro furtivo, explorador, rastreador ou caçador que deseja combinar as perícias do Ladino com a temática de um Guardião.", ["Sobrevivência.", "Exploração.", "Reconhecimento de ambientes.", "Mobilidade.", "Combate à distância.", "Emboscadas."], ["Combate prolongado na linha de frente.", "Cura.", "Conjuração.", "Proteção coletiva.", "Enfrentar inimigos com mobilidade superior."], ""],
"Juramento da Devoção (Oath of Devotion)": ["O paladino da justiça.", "Arma Sagrada — acrescenta seu modificador de Carisma às jogadas de ataque com uma arma escolhida, podendo fazer com que ela cause dano radiante. Também desenvolve uma aura que protege contra encantamentos.", "Para interpretar um cavaleiro heroico, campeão da justiça ou defensor dos inocentes que jamais abandona seus princípios.", ["Precisão dos ataques.", "Dano radiante.", "Proteção de aliados.", "Resistência a encantamentos.", "Combate contra criaturas profanas."], ["Furtividade.", "Mobilidade sobrenatural.", "Controle de grandes áreas.", "Combate à distância.", "Flexibilidade moral do juramento."], ""],
"Juramento dos Anciões (Oath of the Ancients)": ["O paladino da luz e da natureza.", "Ira da Natureza — invoca vinhas espectrais que podem restringir inimigos próximos. Sua Aura de Proteção também concede resistência a danos necróticos, psíquicos e radiantes na versão de 2024.", "Para interpretar um cavaleiro feérico, protetor das florestas ou guerreiro que luta pela preservação da vida, da felicidade e da esperança.", ["Proteção coletiva.", "Resistências sobrenaturais.", "Magia natural.", "Controle de inimigos.", "Sobrevivência.", "Mobilidade mágica."], ["Dano adicional direto.", "Perseguir inimigos distantes.", "Furtividade.", "Destruição em grandes áreas."], ""],
"Juramento da Glória (Oath of Glory)": ["O paladino dos feitos lendários.", "Atleta Inigualável — aprimora capacidades atléticas, acrobáticas e físicas. Sua Destruição Inspiradora também concede pontos de vida temporários após utilizar Destruição Divina.", "Para interpretar um herói mitológico, campeão de arena ou aventureiro semelhante a Hércules, cuja vida é dedicada à realização de grandes feitos.", ["Atletismo.", "Mobilidade.", "Desafios físicos.", "Pontos de vida temporários.", "Inspirar companheiros.", "Combate marcial."], ["Controle territorial.", "Furtividade.", "Resistências elementais adicionais.", "Combate de longa distância."], ""],
"Juramento da Vingança (Oath of Vengeance)": ["O paladino executor.", "Voto de Inimizade — concede vantagem nas jogadas de ataque contra um inimigo escolhido. Na versão de 2024, pode transferir o voto para outro inimigo elegível quando o alvo original cai a 0 pontos de vida.", "Para interpretar um justiceiro sombrio, caçador implacável ou guerreiro movido pela necessidade de destruir um grande mal.", ["Dano contra alvos individuais.", "Enfrentar chefes.", "Precisão.", "Perseguir inimigos.", "Teletransporte.", "Combate agressivo."], ["Proteção coletiva adicional.", "Cura especializada.", "Dano em grandes áreas.", "Controle simultâneo de muitos adversários.", "Resolver conflitos pacificamente."], ""],
"Juramento dos Gênios Nobres (Oath of the Noble Genies)": ["O paladino elemental.", "Esplendor do Gênio — desenvolve uma defesa sobrenatural sem armadura e poderes elementais associados aos quatro tipos de gênios nobres.", "Para interpretar um cavaleiro elemental, guerreiro das Mil e Uma Noites ou campeão dos soberanos dos Planos Elementais.", ["Dano elemental.", "Defesa sem armadura.", "Versatilidade mágica.", "Mobilidade.", "Controle de inimigos."], ["Cura especializada.", "Furtividade especializada.", "Conjuração de alto círculo.", "Combate de longa distância."], ""],
"Juramento da Luz Sagrada (Oath of the Holy)": ["O paladino curandeiro.", "Farol de Luz — estabelece uma bênção sobre um aliado, permitindo que ele também recupere pontos de vida quando o Paladino cura outras criaturas. Posteriormente, pode recuperar recursos de cura causando dano radiante.", "Para interpretar um cavaleiro curandeiro, protetor dos inocentes ou campeão sagrado especializado em manter seus companheiros vivos.", ["Cura coletiva.", "Proteção de aliados.", "Remoção de condições.", "Dano radiante.", "Recuperação de recursos curativos.", "Sobrevivência do grupo."], ["Dano adicional individual.", "Furtividade.", "Controle territorial.", "Combate de longa distância.", "Aproveitar suas habilidades em combates solitários."], ""],
"Juramento da Lâmina de Ébano (Oath of the Ebon Blade)": ["O paladino cavaleiro da morte.", "Forja Rúnica — encanta sua arma com runas de Sangue, Gelo ou Profanação, desenvolvendo poderes diferentes conforme sua especialização. Substitui determinadas características tradicionais do Paladino por habilidades necromânticas.", "Para interpretar um cavaleiro da morte, guerreiro necromante ou personagem inspirado em Arthas de World of Warcraft.", ["Dano necrótico.", "Magia rúnica.", "Manipulação de energia vital.", "Invocação de mortos-vivos.", "Controle de inimigos.", "Combate corporal."], ["Cura convencional de aliados vivos.", "Furtividade.", "Simplicidade mecânica.", "Enfrentar imunidades necróticas.", "Combate de longa distância."], "Essa subclasse também modifica algumas habilidades da classe base, incluindo Imposição das Mãos e Destruição Divina."],
"Juramento da Coroa (Oath of the Crown)": ["O paladino defensor do reino.", "Desafio do Campeão — impede que inimigos afetados se afastem voluntariamente além de determinada distância. Também desenvolve a capacidade de receber danos destinados a aliados próximos.", "Para interpretar um cavaleiro real, guarda-costas, defensor de uma cidade ou guerreiro cuja lealdade pertence ao seu reino.", ["Proteção de aliados.", "Controle territorial.", "Combate na linha de frente.", "Cura emergencial.", "Atrair e conter inimigos.", "Resistência coletiva."], ["Mobilidade.", "Combate à distância.", "Dano adicional individual.", "Furtividade.", "Proteger aliados muito dispersos."], ""],
"Juramento da Conquista (Oath of Conquest)": ["O paladino tirano.", "Presença Conquistadora — amedronta inimigos próximos. Sua Aura da Conquista reduz a zero o deslocamento de criaturas amedrontadas por ele dentro da aura, causando também dano psíquico.", "Para interpretar um conquistador, cavaleiro imperial, tirano ou comandante militar que domina seus inimigos através do medo.", ["Intimidação.", "Causar medo.", "Controle territorial.", "Imobilização de inimigos.", "Precisão dos ataques.", "Dominação do campo de batalha."], ["Enfrentar imunidade ao medo.", "Cura especializada.", "Furtividade.", "Mobilidade.", "Combate de longa distância."], ""],
"Juramento da Redenção (Oath of Redemption)": ["O paladino da misericórdia.", "Repreender os Violentos — utiliza sua reação e Canalizar Divindade para devolver dano radiante a uma criatura que feriu outra. Também pode receber danos destinados aos seus companheiros.", "Para interpretar um pacifista, cavaleiro misericordioso ou guerreiro que acredita que salvar uma alma é mais importante do que destruir um inimigo.", ["Diplomacia.", "Proteção de aliados.", "Retaliação.", "Resolução pacífica de conflitos.", "Recuperação individual.", "Controle através de magias."], ["Agressividade constante.", "Dano adicional ofensivo.", "Mobilidade.", "Combate de longa distância.", "Absorver grandes quantidades de dano sem se colocar em perigo."], ""],
"Juramento dos Vigilantes (Oath of the Watchers)": ["O paladino protetor dos planos.", "Vontade dos Vigilantes — concede vantagem em salvaguardas de Inteligência, Sabedoria e Carisma a criaturas escolhidas. Sua Aura da Sentinela também fortalece a iniciativa dos companheiros.", "Para interpretar um caçador de demônios, inquisidor extraplanar ou cavaleiro dedicado a proteger o mundo material de ameaças cósmicas.", ["Resistência mental.", "Iniciativa coletiva.", "Proteção contra magia.", "Combate contra criaturas extraplanares.", "Banimento de inimigos.", "Suporte defensivo."], ["Dano adicional direto.", "Cura especializada.", "Furtividade.", "Controle físico de inimigos.", "Aproveitar determinados poderes contra criaturas comuns."], ""],
"Quebrador de Juramento (Oathbreaker)": ["O paladino profano.", "Controlar Mortos-Vivos — utiliza Canalizar Divindade para submeter determinados mortos-vivos. Sua Aura de Ódio acrescenta seu modificador de Carisma ao dano de ataques corpo a corpo com armas realizados por ele e por ínferos e mortos-vivos próximos.", "Para interpretar um cavaleiro caído, guerreiro necromante, campeão das trevas ou antigo herói consumido pela corrupção.", ["Dano corporal elevado.", "Comandar mortos-vivos.", "Necromancia.", "Causar medo.", "Resistência individual.", "Fortalecer criaturas profanas."], ["Cura especializada.", "Furtividade.", "Combate de longa distância.", "Interações com organizações religiosas hostis.", "Fortalecimento acidental de mortos-vivos e ínferos inimigos."], "Exige autorização do mestre. Simplesmente descumprir um juramento não transforma automaticamente um Paladino em Quebrador de Juramento. Existe também uma revisão experimental publicada em Unearthed Arcana de 2025."],
"Juramento dos Mares Abertos (Oath of the Open Sea)": ["O paladino da liberdade.", "Camada Marinha e Fúria das Marés — manifesta uma névoa protetora e desenvolve ataques capazes de empurrar adversários. Também possui uma aura que protege contra determinados efeitos de restrição física.", "Para interpretar um capitão pirata heroico, cavaleiro marítimo, explorador dos oceanos ou guerreiro que luta contra a tirania.", ["Exploração marítima.", "Mobilidade.", "Movimentação forçada.", "Controle territorial.", "Proteção contra agarrões.", "Combate naval."], ["Cura especializada.", "Dano adicional direto.", "Combate de longa distância.", "Aproveitar certas habilidades longe da água."], "Conteúdo de terceiros disponibilizado no D&D Beyond, não uma subclasse oficial da Wizards of the Coast."],
"Feitiçaria Dracônica (Draconic Sorcery)": ["O feiticeiro dos dragões.", "Resiliência Dracônica — aumenta seus pontos de vida máximos e concede uma defesa natural sem armadura baseada em Destreza e Carisma. Posteriormente, desenvolve afinidade elemental e asas dracônicas.", "Para interpretar um descendente de dragões, guerreiro de sangue dracônico ou conjurador que busca despertar o poder dessas criaturas ancestrais.", ["Dano elemental.", "Defesa individual.", "Resistência elemental.", "Mobilidade aérea.", "Sobrevivência.", "Invocação de dragões."], ["Cura especializada.", "Combate com armas.", "Proteção direta de aliados.", "Enfrentar imunidades elementais."], ""],
"Feitiçaria da Magia Selvagem (Wild Magic Sorcery)": ["O feiticeiro do caos.", "Surto de Magia Selvagem — pode desencadear efeitos mágicos aleatórios ao conjurar magias. Também consegue manipular a sorte através de suas Marés do Caos.", "Para interpretar um conjurador imprevisível, aventureiro caótico ou personagem cuja magia possui consequências inesperadas e frequentemente cômicas.", ["Manipulação da sorte.", "Efeitos mágicos inesperados.", "Versatilidade.", "Improvisação.", "Manipulação de jogadas."], ["Previsibilidade.", "Controle absoluto dos poderes.", "Segurança dos companheiros.", "Planejamento de efeitos específicos.", "Defesa física."], ""],
"Feitiçaria Aberrante (Aberrant Sorcery)": ["O feiticeiro do horror cósmico.", "Feitiçaria Psiônica — permite conjurar determinadas magias utilizando Pontos de Feitiçaria, dispensando vários componentes. Também desenvolve comunicação telepática e resistência a influências mentais.", "Para interpretar um telepata, sobrevivente de experimentos aberrantes, conjurador alienígena ou manipulador de poderes cósmicos.", ["Telepatia.", "Manipulação mental.", "Dano psíquico.", "Conjuração discreta.", "Espionagem.", "Controle de inimigos."], ["Combate marcial.", "Cura especializada.", "Resistência física.", "Enfrentar imunidades psíquicas."], ""],
"Feitiçaria Mecânica (Clockwork Sorcery)": ["O feiticeiro da ordem absoluta.", "Restaurar Equilíbrio — utiliza sua reação para impedir que uma jogada seja afetada por vantagem ou desvantagem. Também desenvolve barreiras protetoras alimentadas por Pontos de Feitiçaria.", "Para interpretar um conjurador metódico, manipulador das leis universais ou feiticeiro conectado ao plano de Mechanus.", ["Proteção de aliados.", "Controle de inimigos.", "Manipulação de jogadas.", "Versatilidade mágica.", "Defesa sobrenatural.", "Neutralização de efeitos mágicos."], ["Combate com armas.", "Dano adicional exclusivo.", "Cura especializada nos níveis iniciais.", "Gerenciamento de recursos."], ""],
"Feitiçaria do Fogo Mágico (Spellfire Sorcery)": ["O feiticeiro da magia primordial.", "Explosão de Fogo Mágico — ao gastar Pontos de Feitiçaria, pode manifestar energia ofensiva de fogo ou radiante, ou conceder pontos de vida temporários. Também desenvolve capacidades de absorção de magia.", "Para interpretar um conjurador que representa a magia em sua forma mais pura, capaz de combinar destruição, proteção e neutralização de feitiços.", ["Dano de fogo e radiante.", "Proteção de aliados.", "Combate contra conjuradores.", "Recuperação de recursos mágicos.", "Magias restauradoras.", "Mobilidade aérea em níveis elevados."], ["Combate marcial.", "Furtividade especializada.", "Dependência de Pontos de Feitiçaria.", "Resistência física natural."], ""],
"Feitiçaria das Sombras (Shadow Sorcery)": ["O feiticeiro da escuridão.", "Olhos da Escuridão e Força da Sepultura — desenvolve sentidos sobrenaturais, consegue enxergar através da própria escuridão mágica e pode resistir a determinados efeitos que o reduziriam a 0 pontos de vida. Também invoca uma criatura sombria que prejudica a resistência inimiga às suas magias.", "Para interpretar um feiticeiro sombrio, sobrevivente de uma maldição ou conjurador especializado em manifestações de escuridão.", ["Furtividade mágica.", "Teletransporte.", "Manipulação da escuridão.", "Sobrevivência.", "Invocação de criaturas sombrias.", "Controle de inimigos."], ["Cura de aliados.", "Combate marcial.", "Proteção coletiva especializada.", "Aproveitar certos poderes em ambientes iluminados.", "Enfrentar criaturas com sentidos especiais."], ""],
"Alma Divina (Divine Soul)": ["O feiticeiro celestial.", "Magia Divina — permite aprender magias da lista de Clérigo, além das magias de Feiticeiro, podendo modificá-las através da Metamagia.", "Para interpretar um descendente de seres celestiais, curandeiro sobrenatural, profeta ou conjurador escolhido por forças divinas.", ["Cura.", "Suporte coletivo.", "Magias divinas.", "Versatilidade mágica.", "Combinação de Metamagia e cura.", "Mobilidade aérea em níveis elevados."], ["Resistência física.", "Combate com armas.", "Quantidade limitada de magias conhecidas.", "Escolher entre tantas opções de magia."], ""],
"Feitiçaria da Tempestade (Storm Sorcery)": ["O feiticeiro dos trovões.", "Magia Tempestuosa — permite voar pequenas distâncias sem provocar ataques de oportunidade ao conjurar magias de nível 1 ou superior. Também desenvolve resistência a eletricidade e trovão, além de manifestações ofensivas de tempestade.", "Para interpretar um conjurador dos relâmpagos, feiticeiro dos ventos ou aventureiro conectado às forças elementais dos céus.", ["Dano elétrico.", "Dano trovejante.", "Mobilidade.", "Resistência elemental.", "Retaliação.", "Voo em níveis elevados."], ["Cura.", "Resistência física.", "Enfrentar imunidades elementais.", "Aproveitar habilidades de curto alcance com segurança.", "Variedade de magias temáticas."], ""],
"Feitiçaria Lunar (Lunar Sorcery)": ["O feiticeiro das luas.", "Manifestação Lunar — possui três fases lunares, que oferecem diferentes benefícios mágicos. Aprende 15 magias adicionais ao longo da progressão e pode reduzir o custo de determinadas aplicações de Metamagia.", "Para interpretar um astrólogo, conjurador lunar, guardião dos ciclos celestes ou feiticeiro que alterna entre poderes de proteção, destruição e controle.", ["Versatilidade mágica.", "Economia de Pontos de Feitiçaria.", "Proteção de aliados.", "Controle de inimigos.", "Adaptação estratégica.", "Quantidade de magias conhecidas."], ["Simplicidade mecânica.", "Combate marcial.", "Resistência física natural.", "Gerenciamento das fases lunares.", "Aproveitar todos os benefícios simultaneamente."], ""],
"Evocador Dracônico (Evoker)": ["O feiticeiro das cinco revoadas dracônicas.", "Especializações dracônicas — adapta as magias da Feitiçaria Dracônica conforme uma das três especializações disponíveis: Devastação (Devastation), focada em dano mágico; Preservação (Preservation), focada em cura e proteção; e Amplificação (Augmentation), focada em fortalecimento de aliados.", "Para interpretar um conjurador dracônico de Azeroth, especialmente um Dracthyr capaz de canalizar os poderes de diferentes revoadas de dragões.", ["Magia dracônica.", "Dano elemental.", "Cura, conforme especialização.", "Fortalecimento de aliados.", "Versatilidade temática."], ["Combate marcial.", "Furtividade especializada.", "Resistência física prolongada.", "Desempenhar todas as especializações simultaneamente."], "Não é uma subclasse completamente independente. Trata-se de uma variante oficial da Feitiçaria Dracônica, com alterações nas opções mágicas. Por isso, não é contabilizada como uma nova subclasse distinta."],
"Círculo da Terra (Circle of the Land)": ["O druida das forças naturais.", "Magias do Círculo da Terra — recebe magias adicionais conforme o tipo de território escolhido, podendo alterar essa escolha após um descanso longo. Também possui capacidades de recuperação de espaços de magia.", "Para interpretar um sábio da natureza, sacerdote tribal ou conjurador especializado em magia primordial, sem depender tanto da transformação animal.", ["Versatilidade mágica.", "Controle territorial.", "Recuperação de espaços de magia.", "Exploração natural.", "Dano mágico em área."], ["Combate com armas.", "Transformações animais ofensivas.", "Resistência física adicional.", "Combate corporal prolongado.", "Mobilidade marcial."], ""],
"Círculo da Lua (Circle of the Moon)": ["O druida metamórfico.", "Formas do Círculo — permite assumir formas animais mais poderosas, com benefícios adicionais de defesa e pontos de vida temporários na versão de 2024. Também consegue conjurar determinadas magias enquanto está transformado.", "Para interpretar um metamórfico, guerreiro selvagem ou protetor da natureza que prefere combater utilizando garras e presas.", ["Transformação animal.", "Resistência individual.", "Combate corporal.", "Exploração terrestre e aérea.", "Adaptabilidade física."], ["Combate com equipamentos.", "Interações sociais enquanto transformado.", "Conjuração irrestrita em Forma Selvagem.", "Dependência das formas disponíveis.", "Gerenciamento da Forma Selvagem."], ""],
"Círculo das Estrelas (Circle of the Stars)": ["O druida cósmico.", "Forma Estrelada — utiliza a Forma Selvagem para assumir uma de três constelações sobrenaturais: Arqueiro (ataques radiantes à distância), Cálice (aprimoramento da cura) e Dragão (concentração e testes mentais).", "Para interpretar um astrólogo, oráculo, sacerdote das estrelas ou druida que utiliza poderes cósmicos em vez de transformações animais tradicionais.", ["Dano radiante.", "Cura de aliados.", "Manutenção de concentração.", "Suporte estratégico.", "Versatilidade mágica."], ["Combate com armas.", "Resistência física natural.", "Utilizar todas as constelações simultaneamente.", "Dependência de recursos de transformação.", "Combate corporal especializado."], ""],
"Círculo do Mar (Circle of the Sea)": ["O druida das tempestades oceânicas.", "Ira do Mar — manifesta uma emanação oceânica que causa dano de frio e pode empurrar inimigos. Posteriormente, desenvolve resistências elementais, voo e a capacidade de compartilhar essa emanação.", "Para interpretar um sacerdote dos oceanos, explorador marítimo ou conjurador que domina tempestades, ondas e forças aquáticas.", ["Dano de frio.", "Movimentação forçada.", "Exploração submarina.", "Resistências elementais.", "Controle territorial."], ["Combate com armas.", "Enfrentar imunidade ao frio.", "Furtividade especializada.", "Dano da emanação a longa distância.", "Cura adicional da subclasse."], ""],
"Círculo dos Sonhos (Circle of Dreams)": ["O druida dos sonhos e das fadas.", "Bálsamo da Corte de Verão — possui uma reserva de dados de cura que pode utilizar como ação bônus para restaurar pontos de vida e conceder pontos de vida temporários. Posteriormente, desenvolve teletransporte.", "Para interpretar um curandeiro feérico, guardião dos sonhos ou druida bondoso dedicado à proteção dos viajantes.", ["Cura de aliados.", "Suporte coletivo.", "Teletransporte.", "Proteção durante descansos.", "Exploração sobrenatural."], ["Dano adicional.", "Combate corporal.", "Resistência física adicional.", "Destruição em área especializada.", "Controle ofensivo adicional."], ""],
"Círculo do Pastor (Circle of the Shepherd)": ["O druida mestre das criaturas.", "Totem Espiritual — invoca espíritos que concedem diferentes benefícios às criaturas próximas: Urso (proteção e força física), Falcão (precisão e percepção) e Unicórnio (cura coletiva). Também desenvolve capacidades que fortalecem criaturas invocadas.", "Para interpretar um protetor dos animais, invocador de feras ou líder espiritual que combate através de seus companheiros naturais.", ["Invocação de criaturas.", "Cura coletiva.", "Fortalecimento de aliados.", "Controle territorial.", "Comunicação com animais."], ["Combate individual.", "Gerenciamento de múltiplas criaturas.", "Resistência física individual.", "Simplicidade mecânica.", "Compatibilidade integral com algumas magias revisadas de 2024."], "Algumas habilidades precisam de ajustes para funcionar plenamente com as novas magias de invocação de 2024."],
"Círculo dos Esporos (Circle of Spores)": ["O druida da decomposição.", "Entidade Simbiótica — utiliza um uso de Forma Selvagem para receber pontos de vida temporários e fortalecer seus ataques e esporos. Também consegue reanimar determinados cadáveres através de fungos.", "Para interpretar um druida necromante, mestre dos fungos, criatura simbiótica ou guardião do ciclo natural da decomposição.", ["Dano necrótico.", "Necromancia.", "Pontos de vida temporários.", "Combate corporal.", "Reanimação de cadáveres."], ["Mobilidade.", "Combate de longa distância especializado.", "Dependência da Entidade Simbiótica.", "Enfrentar imunidade necrótica.", "Manter seus benefícios após perder pontos de vida temporários."], "Uma revisão para a 5.5e foi apresentada em setembro de 2026 através de Unearthed Arcana: Underdark Options 2, ainda como material experimental."],
"Círculo do Fogo Selvagem (Circle of Wildfire)": ["O druida da destruição e do renascimento.", "Invocar Espírito do Fogo Selvagem — utiliza um uso de Forma Selvagem para convocar um companheiro elemental de fogo, capaz de atacar e teletransportar aliados. Posteriormente, fortalece magias de fogo e cura.", "Para interpretar um druida das chamas, guardião de vulcões ou conjurador que combina destruição elemental com recuperação de vidas.", ["Dano de fogo.", "Cura de aliados.", "Teletransporte coletivo.", "Controle de posicionamento.", "Combate em dupla."], ["Enfrentar imunidade ao fogo.", "Combate com armas.", "Dependência do espírito.", "Resistência física natural.", "Gerenciamento de ações bônus."], "Esses quatro círculos de legado integram o catálogo de subclasses tradicionais apresentado pelo D&D Beyond."],
"Druida Feral (Feral)": ["O druida predador.", "Forma Felina — recebe uma forma animal especializada que substitui determinadas características do Círculo da Lua.", "Para interpretar um predador selvagem especializado em combate físico ofensivo.", ["Dano físico.", "Mobilidade.", "Combate corporal.", "Perseguir inimigos."], ["Cura especializada.", "Proteção coletiva.", "Combate à distância.", "Defesa comparada à variante Guardiã."], "O Druida não recebeu uma subclasse totalmente nova neste suplemento, e sim opções para representar as quatro especializações druídicas de Azeroth. As outras duas usam círculos existentes como base: Equilíbrio (Balance), do Círculo das Estrelas, com foco em magia cósmica ofensiva; e Restauração (Restoration), do Círculo da Terra, com foco em cura e magia natural. Essas opções não são contabilizadas como círculos independentes."],
"Druida Guardião (Guardian)": ["O druida da resistência selvagem.", "Forma de Urso — recebe uma forma animal especializada em resistência e combate defensivo.", "Para interpretar um druida tanque, protetor do grupo ou guerreiro selvagem extremamente resistente.", ["Resistência física.", "Combate na linha de frente.", "Sobrevivência.", "Defesa individual."], ["Combate à distância.", "Furtividade.", "Cura especializada.", "Mobilidade comparada à variante Feral."], "Variante do Círculo da Lua, não contabilizada como círculo independente."],
"Círculo da Preservação (Circle of Preservation)": ["O druida da sobrevivência.", "Manifesta áreas de energia revitalizante utilizando recursos de Forma Selvagem, concedendo benefícios protetores às criaturas.", "Para interpretar um druida de um mundo pós-apocalíptico, como Dark Sun, dedicado a preservar aquilo que resta da natureza.", ["Suporte coletivo.", "Proteção de aliados.", "Pontos de vida temporários.", "Sobrevivência."], ["Dano adicional direto.", "Combate marcial.", "Combate solitário.", "Especialização ofensiva."], "Material experimental, não uma subclasse definitiva."],
"Círculo do Titã (Circle of the Titan)": ["O druida dos monstros colossais.", "Forma Titânica — transforma-se utilizando um dos três modelos de criaturas monstruosas: Behemoth (monstro terrestre colossal), Leviatã (monstro aquático) e Insetoide (criatura monstruosa de aparência insetoide).", "Para interpretar um druida inspirado em Godzilla, monstros gigantes ou criaturas primordiais que representam a vingança da natureza.", ["Transformações monstruosas.", "Combate corporal.", "Poder físico.", "Controle territorial."], ["Furtividade.", "Discrição social.", "Combate em espaços apertados.", "Dependência da transformação."], "Material experimental, não uma subclasse definitiva."],
"Alquimista (Alchemist)": ["O artífice das poções e das transmutações.", "Elixir Experimental — produz elixires que concedem diferentes benefícios mágicos. Sua especialização também fortalece magias curativas e determinados tipos de dano.", "Para interpretar um alquimista, médico, cientista maluco, fabricante de poções ou pesquisador de substâncias sobrenaturais.", ["Cura de aliados.", "Produção de elixires.", "Suporte coletivo.", "Remoção de condições.", "Dano químico e elemental.", "Fortalecimento de companheiros."], ["Combate corporal.", "Dano físico.", "Dano explosivo.", "Resistência física adicional.", "Controle territorial.", "Combate solitário."], ""],
"Armeiro (Armorer)": ["O artífice da armadura tecnológica.", "Armadura Arcana — transforma uma armadura em um equipamento mágico personalizado, escolhendo entre três modelos na versão de 2025: Guardião (Guardian), especializado em defesa e proteção de aliados, utilizando manoplas trovejantes para incentivar inimigos a atacarem o Artífice; Infiltrador (Infiltrator), especializado em furtividade, velocidade e ataques elétricos à distância; e Colosso (Dreadnaught), especializado em força, crescimento corporal, alcance e manipulação do posicionamento dos inimigos, introduzido em 2025.", "Para interpretar um inventor semelhante ao Homem de Ferro, cavaleiro tecnológico, engenheiro de armaduras ou guerreiro steampunk.", ["Defesa individual.", "Combate com armadura.", "Personalização de equipamentos.", "Proteção de aliados.", "Furtividade, conforme o modelo.", "Versatilidade marcial."], ["Cura especializada.", "Conjuração de alto círculo.", "Combate sem sua armadura especial.", "Dano mágico em grandes áreas.", "Utilizar todos os modelos simultaneamente.", "Gerenciamento de equipamentos."], ""],
"Artilheiro (Artillerist)": ["O artífice das armas de destruição.", "Canhão Místico — constrói um dispositivo mágico com três configurações possíveis: Lança-chamas (dano de fogo em área), Balista de Força (dano de força e empurrão) e Protetor (pontos de vida temporários para aliados). Também desenvolve um instrumento arcano capaz de fortalecer suas magias ofensivas.", "Para interpretar um engenheiro militar, fabricante de armas mágicas, especialista em explosões ou inventor que utiliza pequenas torres de combate.", ["Dano mágico à distância.", "Dano em área.", "Controle de posicionamento.", "Proteção coletiva.", "Construção de canhões.", "Combate contra grupos."], ["Combate corporal.", "Cura direta.", "Resistência física natural.", "Combate sem seus dispositivos.", "Gerenciamento de ações bônus.", "Conjuração de alto círculo."], ""],
"Ferreiro de Batalha (Battle Smith)": ["O artífice dos companheiros mecânicos.", "Defensor de Aço — constrói uma criatura artificial que luta ao seu lado e protege companheiros. Também pode utilizar Inteligência em ataques com armas mágicas e recebe Ataque Extra.", "Para interpretar um engenheiro de robôs, ferreiro encantador, cavaleiro acompanhado por um golem ou inventor que participa diretamente das batalhas.", ["Combate com armas mágicas.", "Combate em dupla.", "Proteção de aliados.", "Inteligência aplicada ao combate.", "Cura e reparação.", "Versatilidade marcial."], ["Dano em grandes áreas.", "Conjuração de alto círculo.", "Furtividade especializada.", "Gerenciamento do companheiro.", "Competir com guerreiros em número de ataques.", "Combate sem o Defensor de Aço."], ""],
"Cartógrafo (Cartographer)": ["O artífice dos caminhos impossíveis.", "Atlas do Aventureiro — produz mapas mágicos que estabelecem conexões entre os integrantes do grupo, favorecendo localização, reconhecimento e coordenação. Também desenvolve capacidades de teletransporte e precisão mágica.", "Para interpretar um explorador lendário, navegador arcano, descobridor de novos continentes ou inventor especializado em viagens e posicionamento estratégico.", ["Exploração.", "Navegação.", "Teletransporte.", "Reconhecimento de ambientes.", "Coordenação de aliados.", "Posicionamento estratégico."], ["Combate corporal especializado.", "Dano explosivo.", "Resistência física adicional.", "Cura especializada.", "Combate solitário.", "Destruição em grandes áreas."], "Essa é a primeira especialização completamente nova do Artífice introduzida na edição revisada."],
"Reanimador (Reanimator)": ["O artífice da vida artificial.", "Companheiro Reanimado — constrói uma criatura artificial de natureza macabra, que pode receber modificações corporais e capacidades especiais conforme o Artífice evolui. Essas modificações podem incluir crescimento corporal, aprimoramento ofensivo, escalada, natação e efeitos aterrorizantes. Em níveis elevados, o Artífice também desenvolve capacidades de ressurreição e transferência de vitalidade.", "Para interpretar um cientista semelhante ao Dr. Frankenstein, médico necromante, cirurgião arcano ou inventor obcecado pela criação de vida artificial.", ["Criação de criaturas artificiais.", "Necromancia.", "Combate em dupla.", "Modificação de criaturas.", "Sobrevivência.", "Ressurreição em níveis elevados."], ["Combate solitário.", "Furtividade convencional.", "Gerenciamento do companheiro.", "Conjuração de alto círculo.", "Interações em sociedades hostis à necromancia.", "Dependência de sua criação."], ""],
"Boxing (Boxe)": ["O mestre dos punhos.", "Soco de Adamante — aumenta progressivamente o dado de dano dos ataques desarmados, chegando a 1d12. Também desenvolve técnicas de atordoamento e ataques adicionais.", "Para interpretar um boxeador, pugilista ou campeão de arena especializado em socos.", ["Dano desarmado.", "Sequências de socos.", "Atordoamento.", "Duelos individuais."], ["Combate à distância.", "Cura.", "Suporte coletivo.", "Enfrentar inimigos voadores."], ""],
"Muay Thai": ["O mestre das oito armas.", "Técnicas de agarrão e postura ofensiva que permitem utilizar Constituição nos ataques desarmados e potencializar seu dano.", "Para interpretar um lutador brutal, resistente e especializado em combate de contato total.", ["Dano corporal.", "Agarrões.", "Resistência física.", "Combate agressivo."], ["Combate à distância.", "Furtividade.", "Cura.", "Suporte coletivo."], ""],
"Capoeira": ["O mestre da dança marcial.", "Roda da Capoeira — estabelece uma área de combate que favorece suas técnicas e permite desenvolver ataques contra múltiplas criaturas.", "Para interpretar um lutador acrobático, dançarino marcial ou guerreiro que utiliza movimentos imprevisíveis.", ["Mobilidade.", "Acrobacias.", "Combater múltiplos inimigos.", "Esquivas."], ["Combate à distância.", "Cura.", "Combate fora de sua roda.", "Proteção coletiva direta."], ""],
"Jiu-Jitsu": ["O mestre da submissão.", "Sistema de domínio — aumenta progressivamente seu controle sobre criaturas agarradas, desenvolvendo técnicas de imobilização e luta no chão.", "Para interpretar um especialista em agarrões, submissões e neutralização de adversários.", ["Agarrões.", "Imobilização.", "Controle individual.", "Luta no chão."], ["Combate à distância.", "Dano em área.", "Inimigos difíceis de agarrar.", "Combater muitos adversários simultaneamente."], ""],
"Açougueiro": ["O mestre das carnes.", "Afiado — recebe proficiência com armas marciais e amplia sua margem de acerto crítico, chegando a 18–20.", "Para interpretar um cozinheiro guerreiro, açougueiro de monstros ou chef especializado em combate corporal.", ["Acertos críticos.", "Combate com armas.", "Identificar fraquezas.", "Preparação de carnes."], ["Combate à distância.", "Controle territorial.", "Defesa especializada.", "Enfrentar inimigos difíceis de atingir."], ""],
"Exótico": ["O mestre dos ingredientes impossíveis.", "Qualquer Um Pode Cozinhar — utiliza invocações treinadas para auxiliar na preparação de alimentos e na aplicação de temperos metamágicos.", "Para interpretar um chef experimental, explorador gastronômico ou especialista em ingredientes monstruosos.", ["Combinação de ingredientes.", "Mutações gastronômicas.", "Suporte coletivo.", "Criatividade culinária."], ["Dano direto.", "Combate solitário.", "Resistência física.", "Dependência de ingredientes."], ""],
"Mixologista": ["O mestre das bebidas.", "Barril Arcano de Destilação — fabrica um recipiente mágico capaz de produzir diferentes líquidos e aprimorar a preparação de bebidas.", "Para interpretar um bartender, cervejeiro mágico ou especialista em bebidas sobrenaturais.", ["Produção de bebidas.", "Poções e líquidos mágicos.", "Suporte.", "Versatilidade de recursos."], ["Combate corporal.", "Dano explosivo.", "Defesa individual.", "Dependência de preparação."], ""],
"Hell’s Kitchen": ["O cozinheiro infernal.", "Estabelece uma conexão infernal e desenvolve técnicas culinárias relacionadas ao fogo, incluindo Churrasco.", "Para interpretar um chef demoníaco, mestre das chamas ou cozinheiro que transforma a cozinha em um espetáculo infernal.", ["Poderes relacionados ao fogo.", "Gastronomia sobrenatural.", "Suporte gastronômico.", "Criatividade."], ["Furtividade.", "Defesa física.", "Enfrentar imunidade ao fogo.", "Dependência de recursos culinários."], ""],
"Hematologista": ["O mestre do sangue.", "Moldar Sangue — aprende um truque exclusivo de manipulação sanguínea e desenvolve técnicas de transfusão.", "Para interpretar um médico especializado em sangue ou curandeiro que combina medicina e magia sanguínea.", ["Cura.", "Transfusões.", "Manipulação sanguínea.", "Sustentar aliados."], ["Combate com armas.", "Dano em área.", "Enfrentar criaturas sem sangue.", "Gerenciamento de compatibilidade sanguínea."], ""],
"Dr. Morte": ["O médico das doenças.", "Doença própria que concede imunidades a doenças e venenos, mas também possui efeitos negativos. Posteriormente, desenvolve venenos sanguíneos e armas biológicas.", "Para interpretar um médico monstruoso, cientista maluco ou pesquisador de doenças sobrenaturais.", ["Venenos.", "Imunidades.", "Armas biológicas.", "Dano adicional."], ["Atletismo.", "Efeitos da própria doença.", "Gerenciamento de pontos de vida.", "Suporte especializado em comparação aos outros arquétipos."], ""],
"Farmacêutico": ["O mestre dos medicamentos.", "Produção de elixires extraordinários, incluindo substâncias que concedem resistência a danos, recuperação de vida e velocidade sobrenatural.", "Para interpretar um farmacêutico, pesquisador medicinal ou especialista em poções terapêuticas.", ["Cura.", "Produção de medicamentos.", "Resistências concedidas a aliados.", "Fortalecimento coletivo."], ["Combate corporal.", "Dano direto.", "Dependência de ingredientes.", "Combate sem preparação."], ""],
"Médico Clandestino": ["O médico do submundo.", "Acesso a conhecimentos, substâncias e serviços do submundo criminoso, desenvolvendo uma poderosa rede de contatos.", "Para interpretar um médico da máfia, cirurgião clandestino ou curandeiro envolvido em conspirações.", ["Contatos criminosos.", "Medicina em situações de risco.", "Influência social.", "Obtenção de recursos."], ["Combate direto.", "Dano em área.", "Atuação longe de suas conexões.", "Defesa física adicional."], ""],
